<title>金銀シグナル検証</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: phone-first single column. Sticky header holds the metal switch and the sample-data badge; a fixed bottom tab bar switches views. */
:root{
  --bg:#ECEEEA; --surface:#FFFFFF; --sunk:#E2E5E0; --ink:#1B2126; --muted:#5B656E; --line:#D3D8D1;
  --gold:#8C6A17; --gold-soft:#F2E8CC; --silver:#56656F; --silver-soft:#E1E6EA;
  --buy:#1C7146; --buy-soft:#DCEEE3; --sell:#A83232; --sell-soft:#F5DDDA; --wait:#6A624C; --wait-soft:#EAE6DA;
  --warn:#7E5200; --warn-soft:#FBEDC6;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111518; --surface:#1A1F24; --sunk:#232A30; --ink:#E6E9EC; --muted:#9AA4AD; --line:#2D353C;
  --gold:#D6AC4E; --gold-soft:#3A3120; --silver:#AAB7C2; --silver-soft:#28313A;
  --buy:#4DC28A; --buy-soft:#173326; --sell:#EF7F7A; --sell-soft:#3D1F1E; --wait:#C4B791; --wait-soft:#2E2B22;
  --warn:#F0C25C; --warn-soft:#3A2F14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111518; --surface:#1A1F24; --sunk:#232A30; --ink:#E6E9EC; --muted:#9AA4AD; --line:#2D353C;
  --gold:#D6AC4E; --gold-soft:#3A3120; --silver:#AAB7C2; --silver-soft:#28313A;
  --buy:#4DC28A; --buy-soft:#173326; --sell:#EF7F7A; --sell-soft:#3D1F1E; --wait:#C4B791; --wait-soft:#2E2B22;
  --warn:#F0C25C; --warn-soft:#3A2F14; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;letter-spacing:.02em;margin-right:auto}
.badge-sample{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--warn);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);padding:2px 8px;border-radius:4px;white-space:nowrap}
.seg{display:flex;background:var(--sunk);border-radius:8px;padding:3px;gap:3px;width:100%}
.seg button{flex:1;border:0;background:transparent;padding:7px 6px;border-radius:6px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:baseline;justify-content:center;gap:6px}
.seg button small{font-family:var(--f-num);font-weight:500;font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.seg button[data-sym="gold"][aria-pressed="true"]{color:var(--gold)}
.seg button[data-sym="silver"][aria-pressed="true"]{color:var(--silver)}

main{padding-block:14px calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:14px}
.view{display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.card > * + *{margin-top:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.note{font-size:12.5px;color:var(--muted);line-height:1.65}

.notice{background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:10px;padding:10px 12px;font-size:13px}
.notice b{color:var(--warn)}
.notice.live{background:var(--buy-soft);border-color:color-mix(in srgb,var(--buy) 35%,transparent)}
.notice.live b{color:var(--buy)}
.badge-sample.live{color:var(--buy);background:var(--buy-soft);border-color:color-mix(in srgb,var(--buy) 35%,transparent)}
.stop{background:var(--sell-soft);border:1px solid color-mix(in srgb,var(--sell) 40%,transparent);border-radius:10px;padding:10px 12px;font-size:13.5px}
.stop b{color:var(--sell)}

.price-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.price-big{font-family:var(--f-num);font-size:32px;font-weight:600;letter-spacing:-.01em;line-height:1}
.price-sub{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.up{color:var(--buy)} .down{color:var(--sell)}

.clock{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.clock .t{flex:1 1 100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:700;font-size:13.5px;cursor:pointer;min-height:38px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.buy{background:var(--buy);border-color:var(--buy);color:#fff}
.btn.sell{background:var(--sell);border-color:var(--sell);color:#fff}
.btn.danger{color:var(--sell);border-color:color-mix(in srgb,var(--sell) 45%,transparent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;min-height:46px;font-size:15px}

.chart-box{position:relative;width:100%;height:250px}
.chart-box canvas{position:absolute;inset:0;width:100%;height:100%}
.chart-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-left:auto}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.legend i.dash{border-top-style:dashed}

.verdict{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pill{font-weight:700;font-size:18px;padding:6px 16px;border-radius:999px;letter-spacing:.04em}
.pill.buy{background:var(--buy-soft);color:var(--buy)}
.pill.sell{background:var(--sell-soft);color:var(--sell)}
.pill.wait{background:var(--wait-soft);color:var(--wait)}
.verdict p{flex:1;min-width:180px;font-size:13.5px}

.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:13.5px;align-items:start}
.checks .mk{font-weight:700;text-align:center;border-radius:4px;font-size:12px;line-height:20px;height:20px}
.checks .ok .mk{background:var(--buy-soft);color:var(--buy)}
.checks .ng .mk{background:var(--sell-soft);color:var(--sell)}
.checks .ng{color:var(--muted)}

.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lv{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.lv .k{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.lv .v{font-family:var(--f-num);font-size:clamp(13px,3.7vw,16px);font-weight:600;white-space:nowrap}
.lv .d{font-size:11.5px;color:var(--muted)}
.lv.tp{border-color:color-mix(in srgb,var(--buy) 40%,var(--line))}
.lv.sl{border-color:color-mix(in srgb,var(--sell) 40%,var(--line))}
.levels.ref{opacity:.6}

.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.kv > div{min-width:0}
.kv .k{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.kv .v{font-family:var(--f-num);font-size:16px;font-weight:600;overflow-wrap:anywhere}
@media (min-width:560px){.kv.four{grid-template-columns:repeat(4,minmax(0,1fr))}}

.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:4px}
.meter span{display:block;height:100%;background:var(--muted)}
.meter span.hot{background:var(--sell)}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.row:first-child{border-top:0}
.row .r{text-align:right}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:0 7px;border-radius:4px;margin-right:6px}
.tag.buy{background:var(--buy-soft);color:var(--buy)}
.tag.sell{background:var(--sell-soft);color:var(--sell)}
.tag.gold{color:var(--gold)} .tag.silver{color:var(--silver)}
.empty{padding:14px 0;color:var(--muted);font-size:13.5px}

.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{padding:7px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left;white-space:normal}
.cmp thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:500}
.cmp td{font-family:var(--f-num)}
.cmp td:first-child{font-family:var(--f-body)}
.scroll-x{overflow-x:auto}

.field{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field label{font-size:13.5px}
.field label small{display:block;color:var(--muted);font-size:11.5px;line-height:1.5}
.field input{width:100%;font-family:var(--f-num);font-size:16px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);text-align:right}

.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--sell-soft);border-radius:8px;padding:10px}
.confirm span{flex:1;min-width:160px;font-size:13px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:720px;margin:0 auto}
nav.tabs button{border:0;background:transparent;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"] svg{stroke:var(--gold)}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgb(0 0 0 / .2)}

footer.disc{font-size:11.5px;color:var(--muted);line-height:1.7}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script>
"use strict";
/* ============================================================
   金銀シグナル検証 — 仮想取引専用。実際の注文・口座接続は一切しません。
   価格データは「サンプル（架空）」です。データ提供元が決まるまで差し替えません。
   ============================================================ */

/* ---------- 保存（この端末のブラウザ内だけ） ---------- */
const KEY = "kinGinKensho.v1";
const store = {   // サンプル用と本物データ用で、記録を分けて保存します
  get(){ try{ const s = localStorage.getItem(KEY+"."+MODE); return s ? JSON.parse(s) : null; }catch(e){ return null; } },
  set(v){ try{ localStorage.setItem(KEY+"."+MODE, JSON.stringify(v)); }catch(e){} }
};

/* ---------- 銘柄と初期設定 ---------- */
const SYMS = {
  gold:   { name:"金スポット", code:"XAU/USD", dec:2 },
  silver: { name:"銀スポット", code:"XAG/USD", dec:3 }
};
const DEFAULT_CFG = {
  capital: 1000000,      // 資金（円）
  riskPerTrade: 2500,    // 1回の許容損失（円）
  dailyLimit: 10000,     // 1日の損失上限（円）
  maxDDPct: 5,           // 最大ドローダウン（％）で停止
  maxPositions: 2,       // 同時保有の上限
  usdjpy: 150,           // ドル円（サンプルでは固定）
  cost: {                // 取引コスト。金は GMOクリック証券「金スポット」の画面（2026/11/04）の値
    // swapLong/swapShort：1オンスを1日持ち越すと払う金額（円）。受け取りはマイナス
    // 金：金利調整額 買 −255円・売 +249円（3日分）→ 1日あたり 買いは85円払う／売りは83円受け取る
    gold:   { spread:0.80,  slip:0.10,  step:0.1, swapLong:85, swapShort:-83 },
    silver: { spread:0.025, slip:0.005, step:1,   swapLong:0,  swapShort:0 }
  },
  params: { fast:20, slow:100, slMult:1.5, rr:2.0 }
};
const CFG_VER = 2;
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function mergeCfg(saved, savedVer){
  const c = clone(DEFAULT_CFG);
  if(!saved) return c;
  for(const k of ["capital","riskPerTrade","dailyLimit","maxDDPct","maxPositions","usdjpy"]) if(typeof saved[k]==="number") c[k]=saved[k];
  // 設定の版が古い（GMOの実際の値を入れる前）なら、金のコストは新しい初期値を使う
  for(const s of ["gold","silver"]) if(saved.cost && saved.cost[s] && !(s==="gold" && savedVer!==CFG_VER)) for(const k in c.cost[s]) if(typeof saved.cost[s][k]==="number") c.cost[s][k]=saved.cost[s][k];
  if(saved.params) for(const k in c.params) if(typeof saved.params[k]==="number") c.params[k]=saved.params[k];
  return c;
}

/* ---------- サンプル価格の生成（毎回同じ値動きになる架空データ） ---------- */
const HIST = 9000, FUT = 1500;   // サンプルの1時間足の本数
let TOTAL = HIST + FUT;
let MODE = "sample";   // "sample"＝架空データ / "live"＝Twelve Data の本物のデータ
let LIVE = null;       // 最新価格（まだ確定していない今の1時間足）
let LOAD_ERR = null;   // 本物のデータを読めなかった理由
let FETCHED_AT = 0;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function genData(){
  const rnd = mulberry32(20261104);
  const gauss = () => { let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const mk = () => ({ t:new Float64Array(TOTAL), o:new Float64Array(TOTAL), h:new Float64Array(TOTAL), l:new Float64Array(TOTAL), c:new Float64Array(TOTAL) });
  const G = mk(), Sv = mk();
  let t = Date.UTC(2025,5,16,0,0,0);
  let lg = Math.log(3900), ls = Math.log(46), vol = 1, drift = 0, left = 0;
  for(let i=0;i<TOTAL;i++){
    while(true){ const wd = new Date(t).getUTCDay(); if(wd===0||wd===6) t += 3600e3; else break; }
    if(left-- <= 0){ drift = (rnd()-0.5)*0.00035; left = 80 + Math.floor(rnd()*420); }
    vol = 0.97*vol + 0.03*(0.55 + 0.9*rnd());
    if(rnd() < 0.004) vol *= 2.2;
    vol = Math.min(vol, 3.2);
    const og = Math.exp(lg), os = Math.exp(ls);
    let hg=og, lgw=og, hs=os, lsw=os;
    for(let k=0;k<4;k++){
      const zg = gauss(), zs = 0.75*zg + 0.66*gauss();
      lg += drift/4 + 0.0012*vol*zg;
      ls += drift*1.25/4 + 0.0021*vol*zs;
      const pg=Math.exp(lg), ps=Math.exp(ls);
      hg=Math.max(hg,pg); lgw=Math.min(lgw,pg); hs=Math.max(hs,ps); lsw=Math.min(lsw,ps);
    }
    G.t[i]=Sv.t[i]=t;
    G.o[i]=og; G.h[i]=hg; G.l[i]=lgw; G.c[i]=Math.exp(lg);
    Sv.o[i]=os; Sv.h[i]=hs; Sv.l[i]=lsw; Sv.c[i]=Math.exp(ls);
    t += 3600e3;
  }
  return { gold:G, silver:Sv, fx:null };
}
let DATA = genData();

/* ---------- 本物のデータ（Twelve Data）を中継役 /api/series から受け取る ---------- */
const CAN_LIVE = !!document.querySelector('meta[name="pfx-live"]');  // Cloudflare に置いたときだけ true
async function fetchSeries(symbol){
  let r;
  try{ r = await fetch("api/series?symbol="+encodeURIComponent(symbol), { cache:"no-store" }); }
  catch(e){ throw { kind:"network" }; }
  let j = null; try{ j = await r.json(); }catch(e){}
  if(!r.ok || !j || !Array.isArray(j.values)) throw { kind:(j && j.error) || "bad_response", code:j && j.code, detail:j && j.message, keyLength:j && j.keyLength, keyId:j && j.keyId, symbol };
  return j.values;   // [時刻(ms), 始値, 高値, 安値, 終値] の配列
}
function buildLive(g, s, f){
  const now = Date.now();
  const split = v => {
    v = [...v].sort((a,b)=>a[0]-b[0]);
    if(!v.length) throw { kind:"empty" };
    const last = v[v.length-1];
    const done = last[0] + 3600e3 <= now ? v : v.slice(0,-1);   // 判断は確定した足だけで行う
    return { done, live:{ price:last[4], t:last[0] } };
  };
  const G = split(g), Sv = s ? split(s) : null, F = split(f);
  const sMap = Sv ? new Map(Sv.done.map(x=>[x[0],x])) : null;
  const both = sMap ? G.done.filter(x=>sMap.has(x[0])) : G.done;   // 銀もあるときは、金と銀の両方がある時間だけ使う
  if(both.length < WARMUP + 100) throw { kind:"short" };
  const n = both.length;
  const mk = () => ({ t:new Float64Array(n), o:new Float64Array(n), h:new Float64Array(n), l:new Float64Array(n), c:new Float64Array(n) });
  const gold = mk(), silver = Sv ? mk() : null, fx = new Float64Array(n);
  let k = 0, lastFx = F.done.length ? F.done[0][4] : F.live.price;
  for(let i=0;i<n;i++){
    const a = both[i];

    while(k < F.done.length && F.done[k][0] <= a[0]){ lastFx = F.done[k][4]; k++; }

/* ---------- 指標（平均線・RSI・値動きの大きさ） ---------- */
function ema(a,n){ const k=2/(n+1), o=new Float64Array(a.length); o[0]=a[0]; for(let i=1;i<a.length;i++) o[i]=a[i]*k+o[i-1]*(1-k); return o; }
function rsi(c,n){ const o=new Float64Array(c.length).fill(50); let g=0,l=0;
  for(let i=1;i<c.length;i++){ const d=c[i]-c[i-1], up=Math.max(d,0), dn=Math.max(-d,0);
    if(i<=n){ g+=up/n; l+=dn/n; } else { g=(g*(n-1)+up)/n; l=(l*(n-1)+dn)/n; }
    if(i>=n) o[i] = l===0 ? 100 : 100-100/(1+g/l); }
  return o; }
function atr(D,n){ const o=new Float64Array(D.c.length); let a=D.h[0]-D.l[0]; o[0]=a;
  for(let i=1;i<D.c.length;i++){ const tr=Math.max(D.h[i]-D.l[i], Math.abs(D.h[i]-D.c[i-1]), Math.abs(D.l[i]-D.c[i-1])); a = i<n ? (a*i+tr)/(i+1) : (a*(n-1)+tr)/n; o[i]=a; }
  return o; }
function sma(a,n){ const o=new Float64Array(a.length); let s=0; for(let i=0;i<a.length;i++){ s+=a[i]; if(i>=n) s-=a[i-n]; o[i]=s/Math.min(i+1,n); } return o; }
const CACHE = {};
function emaOf(sym,n){ const k=sym+":e"+n; return CACHE[k] || (CACHE[k]=ema(DATA[sym].c,n)); }
function fxAt(i){ return MODE==="live" ? DATA.fx[i] : S.cfg.usdjpy; }          // その時点のドル円
function fxNow(){ return MODE==="live" ? LIVE.fx.price : S.cfg.usdjpy; }
function midNow(sym){ return MODE==="live" ? LIVE[sym].price : DATA[sym].c[S.nowIdx]; }  // 今の価格（売値と買値の中間）
function tNow(){ return MODE==="live" ? Date.now() : DATA.gold.t[S.nowIdx]; }
function base(sym){ const k=sym+":b"; if(!CACHE[k]){ const a=atr(DATA[sym],14); CACHE[k]={ rsi:rsi(DATA[sym].c,14), atr:a, atrAvg:sma(a,100) }; } return CACHE[k]; }

/* ---------- 売買判断のルール ----------
   買い：大きな流れが上向き ＋ 一時的な下げから短期平均線を上に抜け直した ＋ 勢いが行き過ぎていない
         ＋ 値動きが荒れすぎていない ＋ コストが損切り幅に比べて小さい。売りはその逆。 */
const WARMUP = 220;
function signalAt(sym, i, p, cfg, explain){
  const D=DATA[sym], ef=emaOf(sym,p.fast), es=emaOf(sym,p.slow), B=base(sym);
  if(i < WARMUP) return { side:"wait", stopDist:0, buy:[], sell:[] };
  const c=D.c[i], a=B.atr[i], r=B.rsi[i], vr=a/B.atrAvg[i];
  const stopDist = p.slMult*a, spread = cfg.cost[sym].spread, costRatio = spread/stopDist;
  const bTrend = es[i]>es[i-24] && c>es[i], sTrend = es[i]<es[i-24] && c<es[i];
  const bCross = D.c[i-1]<=ef[i-1] && c>ef[i], sCross = D.c[i-1]>=ef[i-1] && c<ef[i];
  const bRsi = r>=40 && r<=70, sRsi = r>=30 && r<=60;
  const calm = vr < 1.8, cheap = costRatio <= 0.10;
  const bOk = bTrend&&bCross&&bRsi&&calm&&cheap, sOk = sTrend&&sCross&&sRsi&&calm&&cheap;
  const side = bOk ? "buy" : sOk ? "sell" : "wait";
  if(!explain) return { side, stopDist };
  const rs = r.toFixed(0), vs = vr.toFixed(1), cs = (costRatio*100).toFixed(0);
  return { side, stopDist, rsi:r, volRatio:vr,
    buy:[
      { ok:bTrend, text:"大きな流れが上向き（長期の平均線が上向きで、価格がその上にある）" },
      { ok:bCross, text:"一時的に下がったあと、短期の平均線を上に抜け直した（直近1時間）" },
      { ok:bRsi,   text:`上がり過ぎていない（RSI ${rs}。40〜70なら可）` },
      { ok:calm,   text:`値動きが荒れすぎていない（ふだんの${vs}倍。1.8倍未満なら可）` },
      { ok:cheap,  text:`取引コストが損切り幅の10％以内（今は${cs}％）` }
    ],
    sell:[
      { ok:sTrend, text:"大きな流れが下向き（長期の平均線が下向きで、価格がその下にある）" },
      { ok:sCross, text:"一時的に上がったあと、短期の平均線を下に抜け直した（直近1時間）" },
      { ok:sRsi,   text:`下がり過ぎていない（RSI ${rs}。30〜60なら可）` },
      { ok:calm,   text:`値動きが荒れすぎていない（ふだんの${vs}倍。1.8倍未満なら可）` },
      { ok:cheap,  text:`取引コストが損切り幅の10％以内（今は${cs}％）` }
    ] };
}
/* 候補価格：買いは売値＋スプレッドで入り、売値で決済する想定（コスト込み） */
function levels(side, mid, stopDist, p, spread){
  const dir = side==="buy" ? 1 : -1, entry = mid + dir*spread/2;
  return { dir, entry, sl: entry - dir*stopDist, tp: entry + dir*stopDist*p.rr };
}
function sizeFor(sym, stopDist, cfg, rate){
  const c = cfg.cost[sym], perUnit = (stopDist + c.slip) * rate;
  const q = Math.floor(cfg.riskPerTrade / perUnit / c.step + 1e-9) * c.step;
  const qty = Math.max(0, +q.toFixed(4));
  return { qty, risk: qty*perUnit, perUnit };
}

/* ---------- 口座とリスク管理（仮想取引・過去検証の共通ルール） ---------- */
function dayKey(t){ return new Date(t + 9*3600e3).toISOString().slice(0,10); } // 日本時間の日付
function newAcct(cfg){ return { balance:cfg.capital, peak:cfg.capital, trades:[], positions:[], halted:null, dayKey:"", dayPnl:0, nextId:1 }; }
function riskBlocks(acct, cfg, sym, newRisk, t){
  const out = [];
  if(sym==="gold" && !gmoOpen(t)) out.push(`GMOクリック証券の取引時間外（日本時間 ${usDst(t)?"7:00〜翌6:00":"8:00〜翌7:00"}、土日は休み）`);
  if(acct.halted) out.push(`最大ドローダウン（${cfg.maxDDPct}％）に達したため、新しい取引を停止中`);
  if(acct.positions.length >= cfg.maxPositions) out.push(`同時に持てるポジションの上限（${cfg.maxPositions}つ）に達している`);
  if(acct.positions.some(x=>x.sym===sym)) out.push("この銘柄はすでに保有中（同じ銘柄は1つまで）");
  const dp = acct.dayKey===dayKey(t) ? acct.dayPnl : 0;
  const openRisk = acct.positions.reduce((s,x)=>s+x.risk,0);
  if(dp <= -cfg.dailyLimit) out.push(`本日の損失が上限（${yen(cfg.dailyLimit)}）に達した`);
  else if(dp - openRisk - newRisk < -cfg.dailyLimit) out.push(`損切りになった場合、本日の損失上限（${yen(cfg.dailyLimit)}）を超えるおそれがある`);
  return out;
}
function openPos(acct, sym, lv, sz, t){
  const pos = { id:acct.nextId++, sym, dir:lv.dir, entry:lv.entry, sl:lv.sl, tp:lv.tp, qty:sz.qty, risk:sz.risk, t };
  acct.positions.push(pos); return pos;
}
/* 1本の足の中で損切り・利確に届いたか。両方届いた足は不利な方（損切り）とみなす */
function checkExit(pos, D, j, c){
  const h=c.spread/2;
  if(pos.dir===1){
    const o=D.o[j]-h, lo=D.l[j]-h, hi=D.h[j]-h;
    if(o<=pos.sl) return { price:o-c.slip, why:"損切り" };
    if(lo<=pos.sl) return { price:pos.sl-c.slip, why:"損切り" };
    if(o>=pos.tp) return { price:o, why:"利確" };
    if(hi>=pos.tp) return { price:pos.tp, why:"利確" };
  } else {
    const o=D.o[j]+h, lo=D.l[j]+h, hi=D.h[j]+h;
    if(o>=pos.sl) return { price:o+c.slip, why:"損切り" };
    if(hi>=pos.sl) return { price:pos.sl+c.slip, why:"損切り" };
    if(o<=pos.tp) return { price:o, why:"利確" };
    if(lo<=pos.tp) return { price:pos.tp, why:"利確" };
  }
  return null;
}
/* 持ち越した日数：日本時間の朝7時（夏時間は6時）をまたいだ回数。週末をまたぐと土日の分も数える */
function rollovers(t0, t1){ const day=86400e3, off=22*3600e3; return Math.max(0, Math.floor((t1-off)/day) - Math.floor((t0-off)/day)); }
/* GMOクリック証券の金スポットの取引時間：日本時間 月曜8:00〜土曜7:00、毎日7:00〜8:00は休み（米国の夏時間は1時間早まる） */
function usDst(t){
  const y=new Date(t).getUTCFullYear();
  const nthSun=(m,n)=>{ const f=new Date(Date.UTC(y,m,1)).getUTCDay(); return Date.UTC(y,m,1+((7-f)%7)+7*(n-1)); };
  return t >= nthSun(2,2)+7*3600e3 && t < nthSun(10,1)+6*3600e3;
}
function gmoOpen(t){
  const j=new Date(t + 9*3600e3 + (usDst(t)?3600e3:0));   // 夏時間でも「8時開始」として扱えるようにずらす
  const wd=j.getUTCDay(), h=j.getUTCHours();
  if(h===7 || wd===0) return false;
  if(wd===6) return h<7;
  if(wd===1) return h>=8;
  return true;
}
function closePos(acct, cfg, pos, price, t, why, rate){
  const c = cfg.cost[pos.sym];
  const days = rollovers(pos.t, t);
  const swap = (pos.dir===1 ? c.swapLong : c.swapShort) * pos.qty * days;
  const gross = (price - pos.entry) * pos.dir * pos.qty * rate;
  const net = gross - swap;
  const cost = (c.spread + (why==="損切り" ? c.slip : 0)) * pos.qty * rate + swap;
  acct.positions = acct.positions.filter(x=>x!==pos);
  const tr = { id:pos.id, sym:pos.sym, dir:pos.dir, qty:pos.qty, entry:pos.entry, exit:price, sl:pos.sl, tp:pos.tp, t:pos.t, exitT:t, why, net, cost };
  acct.trades.push(tr);
  acct.balance += net;
  const dk = dayKey(t);
  if(acct.dayKey !== dk){ acct.dayKey = dk; acct.dayPnl = 0; }
  acct.dayPnl += net;
  acct.peak = Math.max(acct.peak, acct.balance);
  if(!acct.halted && (acct.peak - acct.balance)/acct.peak*100 >= cfg.maxDDPct)
    acct.halted = { t, text:`資金が最高値から${cfg.maxDDPct}％以上減ったため停止しました` };
  return tr;
}

/* ---------- 成績の集計 ---------- */
function stats(trades, capital){
  let eq=capital, peak=capital, mdd=0, gp=0, gl=0, wins=0, cost=0;
  for(const tr of trades){ eq+=tr.net; peak=Math.max(peak,eq); mdd=Math.max(mdd,peak-eq); if(tr.net>0){wins++;gp+=tr.net;} else gl-=tr.net; cost+=tr.cost; }
  const n=trades.length;
  return { n, wins, winRate:n?wins/n:0, gp, gl, pf: gl>0 ? gp/gl : (gp>0?Infinity:0), net:eq-capital, mdd, mddPct: mdd/ (capital+Math.max(0,peak-capital)) * 100, cost, avgWin: wins?gp/wins:0, avgLoss: (n-wins)?gl/(n-wins):0, avg: n?(eq-capital)/n:0 };
}

/* ---------- 過去検証 ---------- */
function backtest(p, cfg, from, to){
  const acct = newAcct(cfg), pending = {};
  for(let i=from;i<to;i++){
    for(const sym of activeSyms()){
      const D=DATA[sym], c=cfg.cost[sym];
      if(pending[sym]){
        const pd=pending[sym]; pending[sym]=null;
        const lv=levels(pd.side, D.o[i], pd.stopDist, p, c.spread), sz=sizeFor(sym,pd.stopDist,cfg,fxAt(i));
        if(sz.qty>0 && riskBlocks(acct,cfg,sym,sz.risk,D.t[i]).length===0) openPos(acct,sym,lv,sz,D.t[i]);
      }
      const pos = acct.positions.find(x=>x.sym===sym);
      if(pos){ const ex=checkExit(pos,D,i,c); if(ex) closePos(acct,cfg,pos,ex.price,D.t[i],ex.why,fxAt(i)); }
      if(i<to-1 && !acct.halted && !acct.positions.some(x=>x.sym===sym)){
        const s=signalAt(sym,i,p,cfg,false);
        if(s.side!=="wait") pending[sym]={ side:s.side, stopDist:s.stopDist };
      }
    }
  }
  for(const pos of [...acct.positions]){ const D=DATA[pos.sym], h=cfg.cost[pos.sym].spread/2; closePos(acct,cfg,pos,D.c[to-1]-pos.dir*h,D.t[to-1],"期間終了",fxAt(to-1)); }
  return { acct, st:stats(acct.trades,cfg.capital), from, to };
}
const GRID = { fast:[10,20,30], slow:[50,100,150], slMult:[1,1.5,2], rr:[1.5,2,2.5] };
function runValidation(cfg){
  const end = S.nowIdx+1, split = WARMUP + Math.floor((end-WARMUP)*0.7);
  const keys = Object.keys(GRID), res = [];
  for(const a of GRID.fast.keys()) for(const b of GRID.slow.keys()) for(const c of GRID.slMult.keys()) for(const d of GRID.rr.keys()){
    const p = { fast:GRID.fast[a], slow:GRID.slow[b], slMult:GRID.slMult[c], rr:GRID.rr[d] };
    if(p.fast >= p.slow) continue;
    const r = backtest(p, cfg, WARMUP, split);
    res.push({ idx:[a,b,c,d], p, st:r.st });
  }
  const find = idx => res.find(r=>r.idx.every((v,k)=>v===idx[k]));
  for(const r of res){
    const ns=[r];
    for(let k=0;k<4;k++) for(const dlt of [-1,1]){ const idx=[...r.idx]; idx[k]+=dlt; const n=find(idx); if(n) ns.push(n); }
    r.score = r.st.n>=20 ? ns.reduce((s,x)=>s+x.st.net,0)/ns.length : -Infinity;
  }
  const robust = res.reduce((a,b)=> b.score>a.score ? b : a);
  const best = res.filter(r=>r.st.n>=20).reduce((a,b)=> b.st.net>a.st.net ? b : a, robust);
  const robustTune = backtest(robust.p, cfg, WARMUP, split), robustConf = backtest(robust.p, cfg, split, end);
  const bestConf = backtest(best.p, cfg, split, end);
  const curTune = backtest(cfg.params, cfg, WARMUP, split), curConf = backtest(cfg.params, cfg, split, end);
  return { at:Date.now(), nowIdx:S.nowIdx, split, end, combos:res.length, startT:DATA.gold.t[WARMUP], splitT:DATA.gold.t[split], endT:DATA.gold.t[end-1],
    robust:{ p:robust.p, tune:robustTune.st, conf:robustConf.st, tuneTrades:robustTune.acct.trades, confTrades:robustConf.acct.trades, tuneHalt:robustTune.acct.halted, confHalt:robustConf.acct.halted },
    best:{ p:best.p, tune:best.st, conf:bestConf.st },
    cur:{ p:clone(cfg.params), tune:curTune.st, conf:curConf.st } };
}

  const sig = signalAt(sym,i,p,S.cfg,true);
  const bOk = sig.buy.filter(x=>x.ok).length, sOk = sig.sell.filter(x=>x.ok).length;
  const lean = sig.side!=="wait" ? sig.side : (bOk>=sOk ? "buy" : "sell");
  const lv = levels(lean, midNow(sym), sig.stopDist, p, c.spread);
  const sz = sizeFor(sym, sig.stopDist, S.cfg, fxNow());
  const blocks = [];
  if(sig.side!=="wait"){
    if(sz.qty<=0) blocks.push(`損切りまでの幅が広く、1回の許容損失（${yen(S.cfg.riskPerTrade)}）に収まる数量がない`);
    blocks.push(...riskBlocks(S.acct,S.cfg,sym,sz.risk,tNow()));
    if(MODE==="live" && Date.now() - LIVE[sym].t > 2*3600e3) blocks.push("最新の価格が2時間以上更新されていない（週末・休場の可能性）");
  }
  const verdict = sig.side!=="wait" && blocks.length===0 ? sig.side : "wait";
  return { sig, lean, lv, sz, blocks, verdict, checks: lean==="buy" ? sig.buy : sig.sell };
}

/* ---------- 描画：ローソク足チャート ---------- */
function setupCanvas(cv){
  const r = cv.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
  cv.width = Math.max(1,Math.round(r.width*dpr)); cv.height = Math.max(1,Math.round(r.height*dpr));
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); return { g, w:r.width, h:r.height };
}
function drawCandles(cv, sym, endIdx, n, lines){
  const { g, w, h } = setupCanvas(cv), D=DATA[sym], p=S.cfg.params;
  const ef=emaOf(sym,p.fast), es=emaOf(sym,p.slow);
  const s = Math.max(0,endIdx-n+1), padR=62, padB=20, padT=8, cw=w-padR, ch=h-padB-padT;
  let lo=Infinity, hi=-Infinity;
  for(let i=s;i<=endIdx;i++){ lo=Math.min(lo,D.l[i],es[i]); hi=Math.max(hi,D.h[i],es[i]); }
  for(const L of lines){ lo=Math.min(lo,L.v); hi=Math.max(hi,L.v); }
  const pad=(hi-lo)*0.06||1; lo-=pad; hi+=pad;
  const y = v => padT + (hi-v)/(hi-lo)*ch, step = cw/n, x = i => (i-s+0.5)*step;
  const ink=css("--ink"), muted=css("--muted"), line=css("--line"), up=css("--buy"), dn=css("--sell"), gold=css("--gold"), silver=css("--silver");
  g.clearRect(0,0,w,h);
  g.font = "11px "+css("--f-num"); g.textBaseline="middle";
  const ticks=5;
  for(let k=0;k<=ticks;k++){ const v=lo+(hi-lo)*k/ticks, yy=y(v); g.strokeStyle=line; g.lineWidth=1; g.beginPath(); g.moveTo(0,yy); g.lineTo(cw,yy); g.stroke(); g.fillStyle=muted; g.textAlign="left"; g.fillText(fp(sym,v),cw+6,yy); }
  g.textAlign="center"; g.textBaseline="alphabetic";
  const lbEvery = n<=24 ? 6 : n<=72 ? 24 : 24;
  for(let i=s;i<=endIdx;i++){
    const hr = (new Date(D.t[i]).getUTCHours()+9)%24;
    if(hr % (lbEvery===6?6:24) === (lbEvery===6?0:9)){
      const lab = lbEvery===6 ? hr+"時" : TFd.format(new Date(D.t[i])).slice(5);
      g.fillStyle=muted; g.fillText(lab, x(i), h-5);
      g.strokeStyle=line; g.setLineDash([2,3]); g.beginPath(); g.moveTo(x(i),padT); g.lineTo(x(i),padT+ch); g.stroke(); g.setLineDash([]);
    }
  }
  if(MODE==="sample"){ g.save(); g.fillStyle=muted; g.globalAlpha=.14; g.font="700 "+Math.min(26,w/12)+"px "+css("--f-body"); g.textAlign="center"; g.textBaseline="middle";
  g.fillText("サンプルデータ（架空）", cw/2, padT+ch/2); g.restore(); }
  const bw = Math.max(1, Math.min(9, step*0.66));
  for(let i=s;i<=endIdx;i++){
    const o=D.o[i], c=D.c[i], col = c>=o ? up : dn;
    g.strokeStyle=col; g.fillStyle=col; g.lineWidth=1;
    g.beginPath(); g.moveTo(Math.round(x(i))+.5,y(D.h[i])); g.lineTo(Math.round(x(i))+.5,y(D.l[i])); g.stroke();
    const top=y(Math.max(o,c)), bh=Math.max(1,Math.abs(y(o)-y(c)));
    g.fillRect(x(i)-bw/2, top, bw, bh);
  }
  const plot = (arr,col,wd) => { g.strokeStyle=col; g.lineWidth=wd; g.beginPath(); for(let i=s;i<=endIdx;i++){ const yy=y(arr[i]); i===s?g.moveTo(x(i),yy):g.lineTo(x(i),yy); } g.stroke(); };
  plot(ef, sym==="gold"?gold:silver, 1.6); plot(es, muted, 1.4);
  for(const L of lines){
    const yy=y(L.v), col = L.kind==="tp"?up : L.kind==="sl"?dn : ink;
    g.save(); g.globalAlpha = L.ref ? .45 : 1; g.strokeStyle=col; g.lineWidth=1.2; g.setLineDash(L.kind==="entry"?[]:[5,4]);
    g.beginPath(); g.moveTo(0,yy); g.lineTo(cw,yy); g.stroke(); g.setLineDash([]);
    g.fillStyle=col; g.fillRect(cw,yy-8,padR,16); g.fillStyle=css("--surface"); g.textAlign="left"; g.textBaseline="middle"; g.font="600 11px "+css("--f-num");
    g.fillText(fp(sym,L.v),cw+4,yy); g.textAlign="right"; g.fillStyle=col; g.font="700 11px "+css("--f-body"); g.fillText(L.label,cw-4,yy-9); g.restore();
  }
}
/* ---------- 描画：資金推移 ---------- */
function drawEquity(cv, series, opts={}){
  const { g, w, h } = setupCanvas(cv);
  const padR=70, padB=20, padT=10, cw=w-padR, ch=h-padB-padT;
  const all = series.flatMap(s=>s.pts);
  const muted=css("--muted"), line=css("--line"), ink=css("--ink");
  g.clearRect(0,0,w,h);
  if(all.length<2){ g.fillStyle=muted; g.font="13px "+css("--f-body"); g.textAlign="center"; g.fillText(opts.empty||"まだ取引がありません", w/2, h/2); return; }
  let lo=Infinity, hi=-Infinity, t0=Infinity, t1=-Infinity;
  for(const p of all){ lo=Math.min(lo,p.v); hi=Math.max(hi,p.v); t0=Math.min(t0,p.t); t1=Math.max(t1,p.t); }
  if(opts.floor!=null){ lo=Math.min(lo,opts.floor); }
  const pad=(hi-lo)*0.1||5000; lo-=pad; hi+=pad; if(t1===t0) t1=t0+1;
  const y=v=>padT+(hi-v)/(hi-lo)*ch, x=t=>(t-t0)/(t1-t0)*cw;
  g.font="11px "+css("--f-num"); g.textBaseline="middle";
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4, yy=y(v); g.strokeStyle=line; g.lineWidth=1; g.beginPath(); g.moveTo(0,yy); g.lineTo(cw,yy); g.stroke(); g.fillStyle=muted; g.textAlign="left"; g.fillText((v/10000).toFixed(1)+"万",cw+6,yy); }
  g.textAlign="left"; g.textBaseline="alphabetic"; g.fillStyle=muted; g.fillText(fd(t0),0,h-5); g.textAlign="right"; g.fillText(fd(t1),cw,h-5);
  if(opts.floor!=null){ const yy=y(opts.floor); g.strokeStyle=css("--sell"); g.setLineDash([5,4]); g.beginPath(); g.moveTo(0,yy); g.lineTo(cw,yy); g.stroke(); g.setLineDash([]); g.fillStyle=css("--sell"); g.textAlign="left"; g.textBaseline="bottom"; g.font="700 11px "+css("--f-body"); g.fillText(opts.floorLabel||"",4,yy-2); }
  if(opts.split!=null){ const xx=x(opts.split); g.strokeStyle=ink; g.globalAlpha=.5; g.setLineDash([3,3]); g.beginPath(); g.moveTo(xx,padT); g.lineTo(xx,padT+ch); g.stroke(); g.setLineDash([]); g.globalAlpha=1; g.fillStyle=muted; g.font="700 11px "+css("--f-body"); g.textBaseline="top"; g.textAlign="right"; g.fillText("調整期間",xx-6,padT+2); g.textAlign="left"; g.fillText("確認期間",xx+6,padT+2); }
  for(const s of series){
    if(s.pts.length<2) continue;
    g.strokeStyle=s.color; g.lineWidth=2; g.beginPath();
    s.pts.forEach((p,k)=>{ k?g.lineTo(x(p.t),y(p.v)):g.moveTo(x(p.t),y(p.v)); }); g.stroke();
    g.save(); g.globalAlpha=.12; g.fillStyle=s.color; g.lineTo(x(s.pts[s.pts.length-1].t),padT+ch); g.lineTo(x(s.pts[0].t),padT+ch); g.closePath(); g.fill(); g.restore();
    const L=s.pts[s.pts.length-1]; g.fillStyle=s.color; g.beginPath(); g.arc(x(L.t),y(L.v),3.5,0,Math.PI*2); g.fill();
  }
}
function curve(trades, capital, t0){ const pts=[{t:t0,v:capital}]; let v=capital; for(const tr of trades){ v+=tr.net; pts.push({t:tr.exitT,v}); } return pts; }

function advance(n){
  const closed=[];
  for(let k=0;k<n && S.nowIdx<TOTAL-1;k++){
    S.nowIdx++;
    for(const pos of [...S.acct.positions]){
      const ex=checkExit(pos,DATA[pos.sym],S.nowIdx,S.cfg.cost[pos.sym]);
      if(ex) closed.push(closePos(S.acct,S.cfg,pos,ex.price,DATA[pos.sym].t[S.nowIdx],ex.why,fxAt(S.nowIdx)));
    }
  }
  save(); render();
  if(closed.length) toast(closed.map(t=>`${SYMS[t.sym].name} ${t.why} ${yen(t.net,true)}`).join(" ／ "));
  else if(S.nowIdx>=TOTAL-1) toast("サンプルデータの終わりに着きました");
}
/* 本物のデータ：新しく確定した足と今の価格で、利確・損切りに届いたかを確かめる */
function processLive(){
  const closed=[];
  for(const pos of [...S.acct.positions]){
    const D=DATA[pos.sym], c=S.cfg.cost[pos.sym];
    let hit=null;
    for(let j=Math.max(0,D.t.length-600); j<D.t.length && !hit; j++){
      if(D.t[j] < pos.t || D.t[j] <= (pos.lastT||0)) continue;   // 記録した後に始まった足だけ
      const ex=checkExit(pos,D,j,c); pos.lastT=D.t[j];
      if(ex) hit={ ...ex, t:D.t[j], rate:DATA.fx[j] };
    }
    if(!hit){
      const bid = LIVE[pos.sym].price - pos.dir*c.spread/2;
      if(pos.dir===1 ? bid<=pos.sl : bid>=pos.sl) hit={ price:(pos.dir===1?Math.min(bid,pos.sl)-c.slip:Math.max(bid,pos.sl)+c.slip), why:"損切り", t:Date.now(), rate:fxNow() };
      else if(pos.dir===1 ? bid>=pos.tp : bid<=pos.tp) hit={ price:pos.tp, why:"利確", t:Date.now(), rate:fxNow() };
    }
    if(hit) closed.push(closePos(S.acct,S.cfg,pos,hit.price,hit.t,hit.why,hit.rate));
  }
  return closed;
}
async function refreshLive(manual){
  try{ await loadLive(); LOAD_ERR=null; }
  catch(e){ if(manual) toast(errText(e)); return; }
  S.nowIdx = TOTAL-1;
  const closed = processLive();
  save(); render();
  if(closed.length) toast(closed.map(t=>`${SYMS[t.sym].name} ${t.why} ${yen(t.net,true)}`).join(" ／ "));
  else if(manual) toast("最新の価格に更新しました");
}
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.sym){ S.sym=b.dataset.sym; save(); render(); return; }
  if(b.dataset.tab){ S.tab=b.dataset.tab; S.ui={}; save(); render(); window.scrollTo(0,0); return; }
  const act=b.dataset.act; if(!act) return;
  if(act==="adv") advance(+b.dataset.n);
  else if(act==="refresh"){ b.disabled=true; b.textContent="更新中…"; refreshLive(true); }
  else if(act==="range"){ S.range=+b.dataset.n; save(); render(); }
  else if(act==="open"){
    const d=currentDecision(S.sym);
    if(d.verdict==="wait") return;
    openPos(S.acct,S.sym,d.lv,d.sz,tNow()); save(); render();
    toast(`仮想取引を記録しました（${SYMS[S.sym].name} ${d.verdict==="buy"?"買い":"売り"} ${d.sz.qty}オンス）`);
  }
  else if(act==="close"){
    const pos=S.acct.positions.find(p=>p.id===+b.dataset.id); if(!pos) return;
    const u=unreal(pos), tr=closePos(S.acct,S.cfg,pos,u.px,tNow(),"手動で決済",fxNow());
    save(); render(); toast(`決済しました ${yen(tr.net,true)}`);
  }
  else if(act==="runbt"){
    b.disabled=true; b.textContent="計算中…（数秒かかります）";
    setTimeout(()=>{ S.bt=runValidation(S.cfg); render(); toast(`${S.bt.combos}通りの設定を試しました`); }, 30);
  }
  else if(act==="usebt" && S.bt){ S.cfg.params=clone(S.bt.robust.p); save(); render(); toast("判断のルールを検証で選んだ設定に変えました"); }
  else if(act==="ask"){ S.ui.ask=b.dataset.what||null; render(); }
  else if(act==="reset"){ S.acct=newAcct(S.cfg); S.ui={}; save(); render(); toast("仮想取引を最初からやり直しました"); }
  else if(act==="resume"){ S.acct.halted=null; S.acct.peak=S.acct.balance; S.ui={}; save(); render(); toast("停止を解除しました"); }
});

  const v=parseFloat(el.value), canMinus=/swap/.test(el.dataset.path);
  if(!isFinite(v) || (v<0 && !canMinus)){ toast(canMinus?"数字を入れてください":"0以上の数字を入れてください"); render(); return; }
  const path=el.dataset.path.split("."); let o=S.cfg; for(let k=0;k<path.length-1;k++) o=o[path[k]];
  if(path[0]==="params" && (path[1]==="fast"||path[1]==="slow")){ if(v<2||v>200){ toast("平均線は2〜200時間で入れてください"); render(); return; } }
  o[path[path.length-1]] = path[path.length-1]==="maxPositions" ? Math.max(1,Math.round(v)) : v;
  if(S.cfg.params.fast>=S.cfg.params.slow) toast("短期の平均線は長期より短くしてください");
  if(S.cfg.cost.gold.step<=0) S.cfg.cost.gold.step=0.1;
  if(S.cfg.cost.silver.step<=0) S.cfg.cost.silver.step=1;
  save(); toast("保存しました");
});
let rz; window.addEventListener("resize", ()=>{ clearTimeout(rz); rz=setTimeout(drawAll,120); });
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawAll); }catch(e){}
new MutationObserver(drawAll).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
if(document.fonts && document.fonts.ready) document.fonts.ready.then(drawAll);
async function boot(){
  if(CAN_LIVE){
    $("#app").innerHTML = `<div class="card">価格データを読み込んでいます…</div>`;
    try{ await loadLive(); MODE="live"; }
    catch(e){ LOAD_ERR=e; MODE="sample"; DATA=genData(); TOTAL=HIST+FUT; for(const k in CACHE) delete CACHE[k]; }
  }
  initState();
  if(MODE==="live"){ processLive(); save(); setInterval(()=>{ if(!document.hidden) refreshLive(false); }, 15*60e3);
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && Date.now()-FETCHED_AT > 15*60e3) refreshLive(false); }); }
  render();
}
boot();
</script>
