name: データの取り先を試す
on:
  push:
    branches: [claude/connection-check-m84res]
    paths: ["scripts/probe.mjs"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node scripts/probe.mjs
