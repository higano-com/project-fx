:root{--bg:#0b1a2b;--card:#12263d;--line:#22405f;--tx:#e6eef7;--mut:#8aa2bb;--up:#ff5a5a;--dn:#3fb6ff;--acc:#f5b041}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:17px;margin:4px 0 10px}
h2{font-size:15px;margin:0 0 8px;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.seg{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto}
.seg button{flex:1;min-width:52px;background:#0a1626;color:var(--mut);border:1px solid var(--line);border-radius:9px;padding:9px 4px;font-size:14px;font-weight:700}
.seg button.on{background:#1e5a8a;color:#fff;border-color:#2f7bb8}
.pos{color:var(--up)}.neg{color:var(--dn)}
.note{color:var(--mut);font-size:12px;line-height:1.5}
.now{background:#0a1626;border-radius:10px;padding:10px;margin-bottom:10px;font-size:13px;line-height:1.6}
.now b{color:var(--acc)}
.sc{border:1px solid var(--line);border-left:4px solid;border-radius:10px;padding:10px;margin-bottom:8px;background:#0e2034}
.sc .t{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.sc .n{font-weight:700}
.sc .p{font-size:13px;font-weight:700;white-space:nowrap}
.bar{background:#0a1626;border-radius:6px;height:6px;margin:6px 0}
.bar div{height:6px;border-radius:6px}
.kv{font-size:13px;line-height:1.6;margin-top:4px}
.kv span{color:var(--mut)}
ul{margin:4px 0;padding-left:18px;font-size:13px;line-height:1.55}
.tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tg i{font-style:normal;font-size:12px;background:#0a1626;border:1px solid var(--line);border-radius:6px;padding:2px 6px}
/* indicators */
.evr{border:1px solid var(--line);border-radius:9px;margin-bottom:5px;background:#0e2034}
.evr.next{border-color:var(--acc)}
.evr summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 10px;cursor:pointer}
.evr summary::-webkit-details-marker{display:none}
.evr .dt{font-size:12px;color:var(--mut);white-space:nowrap}
.evr .nm{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evr .st{font-size:11px;color:var(--acc);white-space:nowrap}
.evr .body{padding:0 10px 10px;font-size:13px;line-height:1.55}
.evr .cd{color:var(--acc);font-size:12px}
.evr .dir{color:var(--mut);font-size:12px;margin-top:4px}
.chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);margin:4px 0 8px}
</style>
</head>

 let h=`<div class="now">${d.span?`<b>見通し期間：${d.span}</b><br>`:""}${d.now}</div>`;
 h+=d.sc.map(s=>`<div class="sc" style="border-left-color:${s.c}">
  <div class="t"><span class="n">${s.n}</span><span class="p" style="color:${s.c}">${s.p}%</span></div>
  <div class="bar"><div style="width:${s.p}%;background:${s.c}"></div></div>
  <ul>${s.why.map(x=>`<li>${x}</li>`).join("")}</ul>
  <div class="kv"><span>サイン：</span>${s.sign}</div>
  <div class="tg">${s.to.map(p=>`<i>${p.toFixed(p<46.6&&p>46.5||p===48.489||p===46.008?3:2)} ${man(pl(p))}</i>`).join("")}</div>
 </div>`).join("");
 if(d.tip)h+=`<div class="note">💡 ${d.tip}</div>`;
 document.getElementById("scen").innerHTML=h;
}
document.querySelectorAll("#tf button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("#tf button").forEach(x=>x.classList.remove("on"));b.classList.add("on");tf=b.dataset.k;renderScen();});

// indicators
let cur="silver";
const LN={5:"最大",4:"高",3:"中",2:"低",1:"小"};
const jst=s=>new Date(s+":00+09:00");
const fd=d=>`${d.getMonth()+1}/${d.getDate()}(${"日月火水木金土"[d.getDay()]}) ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
const cd=ms=>{if(ms<0)return"発表済み";const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h>=24?`あと${Math.floor(h/24)}日${h%24}時間`:`あと${h}時間${m}分`};
function renderEv(){
 const now=Date.now(),past=document.getElementById("showPast").checked;
 document.getElementById("cNote").textContent=CINFO[cur];
 const open=new Set([...document.querySelectorAll(".evr[open]")].map(x=>x.dataset.id));
 const L=EVENTS.map((e,i)=>({...e,i,d:jst(e.at)})).filter(e=>e.imp[cur]>0&&(past||e.d.getTime()>now-2*36e5)).sort((a,b)=>a.d-b.d);
 const nx=L.findIndex(e=>e.d.getTime()>now-30*6e4);
 document.getElementById("evList").innerHTML=L.map((e,k)=>{const l=e.imp[cur];
  return `<details class="evr ${k===nx?"next":""}" data-id="${e.i}" ${open.has(String(e.i))?"open":""}><summary>
  <span class="dt">${fd(e.d)}</span><span class="nm">${k===nx?"▶ ":""}${e.name}</span><span class="st">${"★".repeat(l)}</span></summary>
  <div class="body"><div class="cd">注意度：${LN[l]} ／ ${cd(e.d.getTime()-now)}</div>${e.why[cur]||""}<div class="dir">${e.dir}</div></div></details>`}).join("")||'<div class="note">該当なし</div>';
}
document.querySelectorAll("#cm button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("#cm button").forEach(x=>x.classList.remove("on"));b.classList.add("on");cur=b.dataset.c;renderEv();});
document.getElementById("showPast").onchange=renderEv;
renderScen();renderEv();setInterval(renderEv,60000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
