name: 原油などが取れるか確かめる
# ツエルブデータで価格が取れるかを確かめて data/raw/symbol-check.txt に保存するだけ。注文・口座接続はしない
on:
  push:
    branches: [claude/connection-check-m84res]
    paths: [".github/workflows/check-symbols.yml", "scripts/check-symbols.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 確かめる
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          mkdir -p data/raw
          node scripts/check-symbols.mjs > data/raw/symbol-check.txt 2>&1 || true
          cat data/raw/symbol-check.txt
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/symbol-check.txt
          git commit -m "原油などが取れるか確かめた結果" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
