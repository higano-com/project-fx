name: 検証用の1分足を取得
# 金の1分足を集めて data/ に保存するだけ。注文・口座接続はしない
on:
  push:
    branches: [claude/connection-check-m84res]
    paths: [".github/workflows/fetch-1min.yml", "data/REQUEST-1min.md"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Twelve Data から1分足を取得（約1年半分）
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          INTERVAL: "1min"
          PAGES: "120"
        run: node scripts/fetch-data.mjs
      - name: data/ を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gzip -kf data/xau_usd_1min.csv && rm -f data/xau_usd_1min.csv
          git add data
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "検証用の1分足を更新（Twelve Data）"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
