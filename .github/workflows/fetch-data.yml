name: 検証用の価格データを取得
# 価格を読んで data/ に保存するだけ。注文・口座接続はしない
on:
  push:
    branches: [claude/connection-check-m84res]
    paths: [".github/workflows/fetch-data.yml", "scripts/fetch-data.mjs", "data/REQUEST.md"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Twelve Data から取得
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: node scripts/fetch-data.mjs
      - name: data/ を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "検証用の価格データを更新（Twelve Data・1時間足）"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
