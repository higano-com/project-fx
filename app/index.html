// ===== 開いたときの自動分析（足のデータから毎回計算する） =====
var AUTO=null, AUTO_LV=null;
const agg=(b,n)=>{const o=[];for(const x of b){const k=Math.floor(x[0]/(n*6e4));const l=o[o.length-1];
 if(l&&l.k===k){l[2]=Math.max(l[2],x[2]);l[3]=Math.min(l[3],x[3]);l[4]=x[4]}else o.push(Object.assign([x[0],x[1],x[2],x[3],x[4]],{k}))}return o};
function rsi(b,n=14){if(b.length<n+1)return 50;let g=0,l=0;for(let i=1;i<=n;i++){const d=b[i][4]-b[i-1][4];d>0?g+=d:l-=d}g/=n;l/=n;
 for(let i=n+1;i<b.length;i++){const d=b[i][4]-b[i-1][4];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}return l===0?100:100-100/(1+g/l)}
function swings(b,k){const H=[],L=[];for(let i=k;i<b.length-k;i++){let h=true,lo=true;for(let j=i-k;j<=i+k;j++){if(b[j][2]>b[i][2])h=false;if(b[j][3]<b[i][3])lo=false}
 if(h)H.push(b[i][2]);if(lo)L.push(b[i][3])}return{H,L}}
const f2=v=>v.toFixed(2);
function analyze(b,k,name,span,spot){
 if(!b||b.length<30)return null;
 const last=isFinite(spot)?spot:b[b.length-1][4], r=rsi(b), {H,L}=swings(b,k);
 const n=Math.min(20,b.length),ma=b.slice(-n).reduce((a,x)=>a+x[4],0)/n;
 const atr=b.slice(-14).reduce((a,x)=>a+(x[2]-x[3]),0)/Math.min(14,b.length);
 const hh=H.length>=2?H[H.length-1]>H[H.length-2]:null, hl=L.length>=2?L[L.length-1]>L[L.length-2]:null;
 const trend=hh&&hl?"up":hh===false&&hl===false?"down":"flat";
 const above=[...new Set(H.filter(x=>x>last+atr*0.15).map(x=>+x.toFixed(2)))].sort((a,b)=>a-b);
 const below=[...new Set(L.filter(x=>x<last-atr*0.15).map(x=>+x.toFixed(2)))].sort((a,b)=>b-a);
 const hi=Math.max(...b.slice(-60).map(x=>x[2])), lo=Math.min(...b.slice(-60).map(x=>x[3]));
 const R1=above[0]??+(Math.max(hi,last+atr)).toFixed(2), R2=+Math.max(above[1]??0,R1+atr*0.5).toFixed(2);
 const S1=below[0]??+(Math.min(lo,last-atr)).toFixed(2), S2=+Math.min(below[1]??1e9,S1-atr*0.5).toFixed(2);
 let up=50; if(trend==="up")up+=10; if(trend==="down")up-=10; if(r>70)up-=8; if(r<30)up+=8; up+=last>ma?5:-5; up=Math.max(25,Math.min(75,up));
 const tw={up:"高値・安値とも切り上げ（上昇の流れ）",down:"高値・安値とも切り下げ（下降の流れ）",flat:"高値・安値の向きがそろわない（もみ合い）"}[trend];
 const rw=r>=70?`RSI ${r.toFixed(0)}：買われすぎ（反落に注意）`:r<=30?`RSI ${r.toFixed(0)}：売られすぎ（反発しやすい）`:`RSI ${r.toFixed(0)}：中立`;
 const mw=last>ma?`直近${n}本の平均${f2(ma)}より上。買いがやや優勢`:`直近${n}本の平均${f2(ma)}より下。売りがやや優勢`;
 return {span,auto:true,
  now:`今 <b>${last.toFixed(3)}</b>。${tw}。${rw}。直近の山 ${f2(R1)}／谷 ${f2(S1)}。1本の平均の値幅は約${atr.toFixed(2)}ドル。`,
  sc:[
   {n:`上：${f2(R1)}突破→${f2(R2)}`,p:up,c:"#ff5a5a",to:[R1,R2],
    why:[`${f2(R1)}は直近の山（戻りの壁）`,trend==="up"?"上昇の流れに沿う向き":trend==="down"?"下降の流れには逆らう向き。戻り売りに注意":"もみ合いの上抜けを狙う形",r<=30?"売られすぎからの戻りが期待できる":r>=70?"買われすぎで伸びにくい面も":mw],
    sign:`${name}が${f2(R1)}の上で確定`},
   {n:`下：${f2(S1)}割れ→${f2(S2)}`,p:100-up,c:"#3fb6ff",to:[S1,S2],
    why:[`${f2(S1)}は直近の谷（支え）`,trend==="down"?"下降の流れに沿う向き":trend==="up"?"上昇の流れには逆らう向き。押し目買いが入りやすい":"もみ合いの下抜けを狙う形",r>=70?"買われすぎからの反落":r<=30?"売られすぎで下げ止まりやすい面も":mw],
    sign:`${name}が${f2(S1)}の下で確定`}],
  R:[R1,R2],S:[S1,S2]};
}
function buildAutoLv(p){
 const A=AUTO, L=[];const add=(v,k,t,d,side)=>{if(!isFinite(v))return;if(side==="up"&&v<=p)return;if(side==="dn"&&v>=p)return;if(L.some(x=>Math.abs(x.p-v)<0.05))return;L.push({p:+v.toFixed(3),k,t,d})};
 if(POS.length&&AVG>p)add(AVG,"sell","全体の建値","建玉の平均","up");
 if(A.h4)A.h4.R.forEach((v,i)=>add(v,"sell",i?"売り（利確）":"売り（一部利確）","4時間足の山（戻りの壁）","up"));
 if(A.h1)add(A.h1.R[0],"sell","売り（一部利確）","1時間足の山（目先の壁）","up");
 if(A.h1)add(A.h1.R[0]+0.08,"buy","買い（上抜け確認後）",`1時間足が${f2(A.h1.R[0])}の上で確定し、押してきたところ`,"up");
 if(A.h1)add(A.h1.S[0],"buy","買い（押し目）","1時間足の谷。下ヒゲが出たら押し目買いの候補","dn");
 if(A.h4)add(A.h4.S[0]-0.03,"stop","損切り（全体）","4時間足の谷割れ。全体の撤退ライン候補","dn");
 if(A.h1&&A.h1.S[1])add(A.h1.S[1]-0.02,"stop","損切り（200枚）","1時間足の2つ目の谷割れ。200枚を減らす候補","dn");
 return L;
}
async function getS(iv){const r=await fetch("api/series?symbol=XAG%2FUSD&interval="+iv,{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();if(!d.values||!d.values.length)throw 0;return d.values}
var BASIS=0;
const shift=(b,o)=>b.map(x=>[x[0],x[1]+o,x[2]+o,x[3]+o,x[4]+o]);
async function autoRun(spot){
 let [m1,h1,d1]=await Promise.all([getS("1min"),getS("1h"),getS("1day")]);
 // 先物の足を、今の現物の値段に合わせて補正する
 BASIS=isFinite(spot)?spot-m1[m1.length-1][4]:0; m1=shift(m1,BASIS); h1=shift(h1,BASIS); d1=shift(d1,BASIS);
 AUTO={m1:analyze(m1.slice(-120),3,"1分足","数分〜1時間",spot),m5:analyze(agg(m1,5),3,"5分足","数時間",spot),
  h1:analyze(h1.slice(-150),3,"1時間足","今日〜明日",spot),h4:analyze(agg(h1,240),2,"4時間足","数日",spot),d1:analyze(d1.slice(-150),3,"日足","数週間",spot)};
 AUTO_LV=buildAutoLv(m1[m1.length-1][4]);
 return m1[m1.length-1];
}

 document.getElementById("lvZ").innerHTML=z;
}
async function getP(sym){const r=await fetch("api/price?symbol="+encodeURIComponent(sym)+"&_="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();if(!isFinite(d.price))throw 0;return d}
async function live(){
 const btn=document.getElementById("lvR");btn.textContent="取得中";
 try{const [ag,jp]=await Promise.all([getP("XAG/USD"),getP("USD/JPY").catch(()=>null)]);
  if(jp)JPY=jp.price;
  try{await autoRun(ag.price)}catch(e){AUTO=null;AUTO_LV=null}
  showLive(ag.price,Date.now(),true);renderScen();}
 catch(e){showLive(44.27,0,false);}
 btn.textContent="更新";
 if(!document.getElementById("st").hidden)strength();
}
document.getElementById("lvR").onclick=live;

// ===== 強弱（主な通貨・商品の前日比） =====
const SD={ag:3,au:1,pt:1,cu:3,oil:2,dxy:2,jpy:2,eur:4,tnx:2,sse:0,aud:4};
const COM=["ag","au","pt","cu","oil"], FX=["dxy","jpy","eur","tnx"], CTY=["cnh","sse","aud","mxn","inr"];
// 国の行の名前と、通貨を「その国の通貨が強くなる＝プラス」にそろえるか（ドル建ての相場は向きを逆にする）
const CN={cnh:["中国","人民元",1],sse:["中国","上海株",0],aud:["豪州","豪ドル",0],mxn:["メキシコ","ペソ",1],inr:["インド","ルピー",1]};
const col=v=>Math.abs(v)<0.005?"var(--tx)":v>0?"var(--up)":"var(--dn)";
const ck=t=>`<span class="ck">${t}</span>`;
// 期間ごとの「ほぼ横ばい」の幅（u：上げ下げ％　g：銀と金の差％　t：金利　mx：棒の最小の幅　tb：金利の棒の幅）
const SMODE=[["m5","5分"],["m15","15分"],["h1","1時間"],["h4","4時間"],["d1","前日"]];
const STH={m5:{u:.02,g:.02,t:.005,mx:.05,tb:.01},m15:{u:.03,g:.03,t:.01,mx:.08,tb:.02},h1:{u:.05,g:.05,t:.01,mx:.15,tb:.03},h4:{u:.05,g:.08,t:.02,mx:.2,tb:.05},d1:{u:.05,g:.1,t:.02,mx:.3,tb:.1}};
let SM="d1",SDATA=null;try{const v=localStorage.getItem("stMode");if(STH[v])SM=v}catch(_){}
function renderSt(d){
 SDATA=d;const T=STH[SM],M={};
 const OFF={};
 for(const x0 of d.items){
  // 最後の足が90分以上前（取引時間外）なら、短い期間では比べない
  if(SM!=="d1"&&x0.t&&d.t-x0.t>90*6e4){OFF[x0.k]=x0.n;continue}
  const ref=SM==="d1"?x0.prev:(x0.r||{})[SM];if(!ref)continue;
  const x={...x0,ref};x.c=x.k==="tnx"?x.p-ref:(x.p/ref-1)*100;if(CN[x.k]&&CN[x.k][2])x.c=(ref/x.p-1)*100;M[x.k]=x}
 // 銀の値段の表示だけ、一番上の値段（現物）にそろえる。動き（％）は他と同じ先物で比べる
 const showP=k=>k==="ag"&&isFinite(NOWP)&&Math.abs(NOWP-M.ag.p)<1.5?NOWP:M[k].p;
 // 強弱は銀と比べて出す：それぞれの動きから銀の動きを引いた差（＋なら銀より強い）。金利は比べられないので出さない
 const rel=!!M.ag, dv=k=>rel?M[k].c-M.ag.c:M[k].c;
 const com=COM.filter(k=>M[k]&&!(rel&&k==="ag")).sort((a,b)=>dv(b)-dv(a)), fx=FX.filter(k=>(M[k]||OFF[k])&&!(rel&&k==="tnx")), cty=CTY.filter(k=>M[k]||OFF[k]);
 const mx=Math.max(T.mx,...[...com,...fx,...cty].filter(k=>k!=="tnx"&&M[k]).map(k=>Math.abs(dv(k))));
 const nmOf=k=>CN[k]?`${CN[k][0]} ${CN[k][1]}`:(M[k]||{}).n||OFF[k];
 const row=(k,g)=>{if(!M[k])return `<div class="sr${g?" gap":""}"><span class="nm">${nmOf(k)}</span><span class="pv"></span><span class="cg">時間外</span><span></span></div>`;if(rel&&k==="ag")return `<div class="sr${g?" gap":""}"><span class="nm">${nmOf(k)}</span><span class="pv">${showP(k).toFixed(SD[k])}</span><span class="cg" style="color:${col(M.ag.c)}">${sgn(M.ag.c)}%</span><span></span></div>`;
  const x=M[k],v=dv(k),tiny=k==="tnx"?Math.abs(v)<T.t:Math.abs(v)<T.u,w=tiny?0:k==="tnx"?Math.min(100,Math.abs(v)/T.tb*100):Math.abs(v)/mx*100,cc=tiny?"var(--tx)":col(v);
  return `<div class="sr${g?" gap":""}"><span class="nm">${nmOf(k)}</span><span class="pv">${CN[k]&&CN[k][2]?"":showP(k).toFixed(SD[k])}</span><span class="cg" style="color:${cc}">${tiny?"ほぼ同じ":sgn(v)+(k==="tnx"?"":"%")}</span><span class="br"><div style="width:${w.toFixed(0)}%;background:${cc}"></div></span></div>`};
 let h=`<div class="seg" id="stM">${SMODE.map(([k,n])=>`<button type="button" data-m="${k}" class="${k===SM?"on":""}">${n}</button>`).join("")}</div>`;
 const pn=SM==="d1"?"前日から":SMODE.find(x=>x[0]===SM)[1]+"前から";
 if(rel)h+=`<div class="sag"><b>銀</b> ${showP("ag").toFixed(3)} <b style="color:${col(M.ag.c)}">${sgn(M.ag.c)}%</b> ${pn}</div>`;
 h+=com.length||fx.length?com.map(k=>row(k,0)).join("")+fx.map((k,i)=>row(k,i===0)).join("")+cty.map((k,i)=>row(k,i===0)).join(""):'<div class="lv2">この期間の値段がありません</div>';
 const L=[], a=M.ag;
 const num=v=>`<b style="color:${col(v)}">${sgn(v)}%</b>`;
 const up=v=>v>=T.u, dn=v=>v<=-T.u;
 if(a&&M.au){const g=a.c-M.au.c;
  L.push(Math.abs(g)<T.g?ck("銀と金はほぼ同じ動き"):ck(`銀が金より${g>0?"強い":"弱い"}`)+" "+ck(`差 ${num(g)}`));
  L.push(ck(`金銀比 ${(M.au.p/a.p).toFixed(1)}`)+" "+ck(`${SM==="d1"?"前日":SMODE.find(x=>x[0]===SM)[1]+"前"} ${(M.au.ref/a.ref).toFixed(1)}`))}
 const vs=(x,nm)=>{if(!a||!x)return;const u=x.c,nb=ck(`${nm} ${num(u)}`);
  if(up(u)&&up(a.c))L.push(nb+" "+ck("上昇なのに銀も上昇")+" "+ck(`<b>銀が強い</b>`));
  else if(dn(u)&&dn(a.c))L.push(nb+" "+ck("下落なのに銀も下落")+" "+ck(`<b>銀が弱い</b>`));
  else if(up(u)&&dn(a.c))L.push(nb+" "+ck("上昇 銀は下落")+" "+ck(`いつもどおり`));
  else if(dn(u)&&up(a.c))L.push(nb+" "+ck("下落 銀は上昇")+" "+ck(`いつもどおり`));
  else L.push(nb+" "+ck("ほぼ横ばい"))};
 vs(M.jpy,"ドル円");vs(M.dxy,"ドル指数");
 if(a&&M.tnx){const t=M.tnx.c;
  if(t>=T.t&&up(a.c))L.push(ck("金利が上昇なのに銀も上昇")+" "+ck("<b>銀が強い</b>"));
  else if(t<=-T.t&&dn(a.c))L.push(ck("金利が低下なのに銀も下落")+" "+ck("<b>銀が弱い</b>"))}
 if(a&&M.cu){const c=M.cu.c;
  const nb=ck(`銅 ${num(c)} 銀 ${num(a.c)}`);
  if(up(c)&&up(a.c))L.push(nb+" "+ck("どちらも上昇"));
  else if(dn(c)&&dn(a.c))L.push(nb+" "+ck("どちらも下落"));
  else if(Math.abs(c-a.c)>=T.g*3)L.push(nb+" "+ck("逆の動き"))}
 // 銀に関わる国の通貨（人民元・豪ドル・ペソ・ルピー）の向き
 const cur=["cnh","aud","mxn","inr"].filter(k=>M[k]);
 if(a&&cur.length>=3){const u=cur.filter(k=>up(M[k].c)).length, dd=cur.filter(k=>dn(M[k].c)).length;
  if(u>=3)L.push(ck("関わる国の通貨も上昇")+" "+ck(up(a.c)?"銀と同じ流れ":"銀だけ弱い"));
  else if(dd>=3)L.push(ck("関わる国の通貨は下落")+" "+ck(dn(a.c)?"銀と同じ流れ":"銀だけ強い"));
  else L.push(ck("関わる国の通貨はまちまち"))}
 if(a&&M.jpy)L.push(ck(`円建ての銀 ${num(a.c+M.jpy.c)}`));
 h+=`<ul>${L.map(x=>`<li>${x}</li>`).join("")}</ul>`;
 h+=`<div class="lv2">${new Date(d.t).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})} 取得</div>`;
 document.getElementById("st").innerHTML=h;
}
async function strength(){
 const el=document.getElementById("st");
 try{const r=await fetch("api/strength?_="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();if(!d.items||!d.items.length)throw 0;renderSt(d)}
 catch(e){el.innerHTML='<div class="lv2">取れませんでした</div>'}
}
document.getElementById("st").addEventListener("click",e=>{if(!SDATA||!e.target.closest)return;
 const b=e.target.closest("#stM button");
 if(b){SM=b.dataset.m;try{localStorage.setItem("stMode",SM)}catch(_){}renderSt(SDATA)}});
document.getElementById("stB").onclick=()=>{const el=document.getElementById("st"),b=document.getElementById("stB");
 el.hidden=!el.hidden;b.classList.toggle("on",!el.hidden);if(!el.hidden){el.innerHTML='<div class="lv2">取得中</div>';strength()}};
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("#askC");if(!a)return;
 try{navigator.clipboard.writeText("シグナル更新して").then(()=>{}).catch(()=>{})}catch(_){}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")live()});
live();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
