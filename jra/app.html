<title>中央競馬 複勝AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* 配置: 上に見出しと更新ボタン、その下にタブ。中身は1列のカード(スマホ前提) */
:root {
  --bg: #f3f5f0; --surface: #ffffff; --line: #dfe4da; --fg: #1d241c; --muted: #66705f;
  --accent: #1f6b3a; --accent-soft: #e2efe4; --hit: #b8860b; --hit-soft: #fbf1d3; --miss: #9aa294;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "Barlow Condensed", "Zen Kaku Gothic New", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121711; --surface: #1a2119; --line: #2c3629; --fg: #e6ebe2; --muted: #9aa594;
  --accent: #6cc58a; --accent-soft: #1f3324; --hit: #e7bd4f; --hit-soft: #3a3118; --miss: #69735f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121711; --surface: #1a2119; --line: #2c3629; --fg: #e6ebe2; --muted: #9aa594;
  --accent: #6cc58a; --accent-soft: #1f3324; --hit: #e7bd4f; --hit-soft: #3a3118; --miss: #69735f; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 12px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
h1 { font-size: 1.25rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.sub { color: var(--muted); font-size: .8rem; }
.btn { font: inherit; font-weight: 700; border: 1px solid var(--accent); background: var(--accent); color: var(--surface);
  border-radius: 999px; padding: 6px 16px; cursor: pointer; }
.btn:disabled { opacity: .6; cursor: default; }
.btn:focus-visible, nav a:focus-visible, .chip:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav { display: flex; gap: 4px; margin: 14px 0 12px; border-bottom: 1px solid var(--line); }
nav a { padding: 8px 14px; color: var(--muted); text-decoration: none; font-weight: 700; border-bottom: 3px solid transparent; margin-bottom: -1px; }
nav a[aria-current="page"] { color: var(--accent); border-color: var(--accent); }
.note { color: var(--muted); font-size: .82rem; margin: 0 0 12px; }
.tag { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 999px;
  background: var(--hit-soft); color: var(--hit); letter-spacing: .04em; }
.list { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.rhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.rno { font-family: var(--font-num); font-weight: 700; font-size: 1.15rem; }
.post { font-family: var(--font-num); font-size: 1.05rem; color: var(--accent); font-weight: 600; }
.rname { color: var(--muted); font-size: .85rem; min-width: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.pick { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; margin-top: 8px;
  padding-top: 8px; border-top: 1px dashed var(--line); }
.umaban { font-family: var(--font-num); font-weight: 700; font-size: 1.3rem; width: 2.2em; height: 2.2em; display: grid;
  place-items: center; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.ev { font-family: var(--font-num); font-weight: 700; font-size: 1.4rem; color: var(--accent); text-align: right; }
.ev small { font-size: .7rem; color: var(--muted); display: block; font-family: var(--font-body); font-weight: 500; }
.meta { color: var(--muted); font-size: .8rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { font: inherit; font-size: .85rem; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 999px; padding: 3px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
details summary { cursor: pointer; list-style: none; }
details summary::-webkit-details-marker { display: none; }
.tbl { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; }
th, td { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: .75rem; }
td.l, th.l { text-align: left; white-space: normal; min-width: 5.5em; }
tr.is-pick td { background: var(--accent-soft); }
tr.top3 td:first-child { color: var(--hit); font-weight: 700; }
.res { font-size: .8rem; font-weight: 700; }
.res.hit { color: var(--hit); } .res.miss { color: var(--miss); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.stat b { display: block; font-family: var(--font-num); font-size: 1.5rem; line-height: 1.2; }
.stat span { color: var(--muted); font-size: .75rem; }
@media (max-width: 480px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>中央競馬 複勝AI</h1>
      <div class="sub" id="updated"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <select id="daySel" aria-label="日付"></select>
      <button id="refreshBtn" class="btn" type="button" hidden>最新にする</button>
    </div>
  </header>
  <div class="sub" id="refreshMsg"></div>
  <nav>
    <a href="#kitai" data-tab="kitai">期待値</a>
    <a href="#race" data-tab="race">レース</a>
    <a href="#seiseki" data-tab="seiseki">成績</a>
  </nav>
  <main id="main"></main>
</div>

<script>
(function () {
  const DATA = /*__DATA__*/null;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pct = (x) => (x == null ? "-" : (x * 100).toFixed(0) + "%");
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const S = { day: null, venue: store.get("venue", "全部") };
  const days = (DATA && DATA.days) || [];
  $("updated").textContent = DATA ? `${DATA.updated} 時点` : "データがありません";

  const fmtDate = (d) => `${+d.slice(4, 6)}/${+d.slice(6, 8)}`;
  const sel = $("daySel");
  sel.innerHTML = days.map((d) => `<option value="${d.date}">${fmtDate(d.date)}</option>`).join("");
  S.day = days.length ? days[days.length - 1].date : null;
  sel.value = S.day || "";
  sel.hidden = days.length < 2;
  sel.addEventListener("change", () => { S.day = sel.value; render(); });

  const curDay = () => days.find((d) => d.date === S.day);
  const nowHM = () => { const t = new Date(Date.now() + (new Date().getTimezoneOffset() + 540) * 60000); return t.toTimeString().slice(0, 5); };

  function resultLine(p) {
    if (p.pay == null) return "";
    return p.pay > 0 ? `<span class="res hit">的中 ${p.pay.toLocaleString()}円</span>` : `<span class="res miss">はずれ</span>`;
  }

  function renderKitai() {
    const d = curDay();
    if (!d) return `<p class="empty">今日は中央競馬の開催がありません。</p>`;
    const isToday = d.date === days[days.length - 1].date;
    const cards = [];
    for (const r of d.races) {
      const picks = r.result ? r.picks : r.horses.filter((h) => h.pick);
      if (!picks.length) continue;
      cards.push(`<div class="card">
        <div class="rhead"><span class="rno">${esc(r.venue)}${r.race_no}R</span><span class="post">${esc(r.post)}発走</span>
          <span class="rname">${esc(r.name)} ${esc(r.course)}</span></div>
        ${picks.map((h) => `<div class="pick">
          <div class="umaban">${h.no}</div>
          <div><b>${esc(h.name)}</b> ${resultLine(h)}<div class="meta">複勝 <span class="num">${h.fmin}〜${h.fmax}</span>倍 ・ 3着内 ${pct(h.p_top)} ・ 単勝 <span class="num">${h.tan}</span>倍${(h.at || r.at) ? ` ・ ${esc(h.at || r.at)}のオッズ` : ""}${(h.label || r.label) === "朝" ? ` ・ <b>朝の参考値</b>` : ""}</div></div>
          <div class="ev">${h.ev.toFixed(2)}<small>期待値</small></div></div>`).join("")}
      </div>`);
    }
    const note = `<p class="note"><span class="tag">検証中</span> 複勝の期待値 = 単勝オッズから出した3着以内の確率 × 複勝オッズの下限。1.0以上の馬を出しています。まだ効くと確かめていない作戦なので、記録をとって検証している段階です。オッズは締切前に動くので、買う前に最新のオッズを確かめてください。${isToday ? `「朝の参考値」は売れ始めのオッズなので当てになりません。発走20分前と5分前にオッズを取り直します。成績の記録には締切5分前のオッズを使います。` : ""}</p>`;
    return note + (cards.length ? `<div class="list">${cards.join("")}</div>` : `<p class="empty">いまは期待値1.0以上の複勝がありません。</p>`);
  }

  function renderRace() {
    const d = curDay();
    if (!d) return `<p class="empty">今日は中央競馬の開催がありません。</p>`;
    const venues = ["全部", ...new Set(d.races.map((r) => r.venue))];
    if (!venues.includes(S.venue)) S.venue = "全部";
    const races = d.races.filter((r) => S.venue === "全部" || r.venue === S.venue);
    const now = nowHM();
    const chips = `<div class="chips">${venues.map((v) => `<button class="chip" type="button" data-venue="${esc(v)}" aria-pressed="${v === S.venue}">${esc(v)}</button>`).join("")}</div>`;
    const cards = races.map((r) => {
      const res = r.result;
      const nPick = r.horses.filter((h) => h.pick).length;
      const open = !res && r.post >= now && races.find((x) => !x.result && x.post >= now) === r;
      const rows = r.horses.map((h) => {
        const f = res && res[String(h.no)];
        const fin = f ? (f.status || f.finish) : "";
        return `<tr class="${h.pick ? "is-pick" : ""} ${f && f.finish && f.finish <= 3 ? "top3" : ""}">
          ${res ? `<td>${esc(fin)}</td>` : ""}<td class="num">${h.no}</td><td class="l">${esc(h.name)}<div class="meta">${esc(h.jockey)}</div></td>
          <td class="num">${h.tan ?? esc(h.status)}</td><td class="num">${h.fmin ?? "-"}〜${h.fmax ?? "-"}</td>
          <td class="num">${pct(h.p_top)}</td><td class="num">${h.ev != null ? h.ev.toFixed(2) : "-"}</td></tr>`;
      }).join("");
      return `<details class="card" ${open ? "open" : ""}><summary class="rhead">
        <span class="rno">${esc(r.venue)}${r.race_no}R</span><span class="post">${esc(r.post)}</span>
        <span class="rname">${esc(r.name)} ${esc(r.course)}</span>
        ${res ? `<span class="res ${r.picks.some((p) => p.pay > 0) ? "hit" : "miss"}">確定</span>` : nPick ? `<span class="tag">候補${nPick}</span>` : ""}</summary>
        <div class="tbl"><table><thead><tr>${res ? "<th>着</th>" : ""}<th>番</th><th class="l">馬名・騎手</th><th>単勝</th><th>複勝</th><th>3着内</th><th>期待値</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
        <div class="meta">${r.at ? `${esc(r.at)} のオッズ(${esc(r.label)})` : "オッズ未取得"}</div></details>`;
    }).join("");
    return chips + `<div class="list">${cards}</div>`;
  }

  function renderSeiseki() {
    const all = [];
    for (const d of days) for (const r of d.races) for (const p of r.picks) if (p.pay != null) all.push({ ...p, date: d.date, r });
    const n = all.length, hit = all.filter((p) => p.pay > 0).length, ret = all.reduce((s, p) => s + p.pay, 0);
    const stats = `<div class="stats">
      <div class="stat"><b>${n}</b><span>点(各100円)</span></div>
      <div class="stat"><b>${hit}</b><span>的中</span></div>
      <div class="stat"><b>${n ? Math.round(ret / n) : "-"}%</b><span>回収率</span></div>
      <div class="stat"><b>${n ? (ret - n * 100 >= 0 ? "+" : "") + (ret - n * 100).toLocaleString() : "-"}</b><span>収支(円)</span></div></div>`;
    const note = `<p class="note"><span class="tag">検証中</span> 締切5分前のオッズで期待値1.0以上だった複勝を、各100円買ったとしたときの記録です。数百点たまるまでは偶然の差が大きいので、回収率は参考程度に見てください。</p>`;
    const rows = all.slice().reverse().map((p) => `<tr><td class="l">${fmtDate(p.date)} ${esc(p.r.venue)}${p.r.race_no}R</td><td class="num">${p.no}</td>
      <td class="l">${esc(p.name)}</td><td class="num">${p.ev.toFixed(2)}</td><td class="num">${p.pay > 0 ? p.pay : "-"}</td></tr>`).join("");
    return note + stats + (n ? `<div class="card tbl"><table><thead><tr><th class="l">レース</th><th>馬番</th><th class="l">馬名</th><th>期待値</th><th>払戻</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<p class="empty">まだ結果の出た候補がありません。レースが終わると、ここに記録されます。</p>`);
  }

  function render() {
    const tab = ["kitai", "race", "seiseki"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "kitai";
    document.querySelectorAll("nav a").forEach((a) => a.setAttribute("aria-current", a.dataset.tab === tab ? "page" : "false"));
    $("main").innerHTML = tab === "race" ? renderRace() : tab === "seiseki" ? renderSeiseki() : renderKitai();
  }
  $("main").addEventListener("click", (e) => {
    const c = e.target.closest("[data-venue]");
    if (c) { S.venue = c.dataset.venue; store.set("venue", S.venue); render(); }
  });
  window.addEventListener("hashchange", render);
  render();

  // 「最新にする」: ルーティンを動かして Claude に最新版を公開してもらう
  const REFRESH_TRIGGER = "trig_013oAwzS52ZmD2Enm55NcCUS";
  (async function () {
    for (let i = 0; i < 20 && !window.claude; i++) await new Promise((ok) => setTimeout(ok, 500));
    if (!window.claude) return;
    let mcp = null;
    try { mcp = await window.claude.use("mcp"); } catch (e) { mcp = null; }
    if (!mcp) return;
    const btn = $("refreshBtn"), msg = $("refreshMsg");
    btn.hidden = false;
    btn.addEventListener("click", async () => {
      btn.disabled = true; btn.textContent = "お願い中…";
      try {
        await mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: REFRESH_TRIGGER }, { cache: false });
        msg.textContent = "Claude に頼みました。1〜2分で新しくなります。";
        btn.textContent = "頼みました";
      } catch (e) {
        msg.textContent = "うまく頼めませんでした。少しして、もう一度押すか、チャットで「更新して」と送ってください。";
        btn.disabled = false; btn.textContent = "最新にする";
      }
    });
  })();
})();
</script>
