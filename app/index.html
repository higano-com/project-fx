<title>ボートレースAI予想</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: 上に「まもなく締切」、場タブ、選んだ場のレースを縦に並べる1カラム。水面と艇の6色が主役 */
:root {
  --bg: #eef3f6;
  --surface: #ffffff;
  --fg: #12232e;
  --muted: #5b6f7c;
  --line: #d3dee5;
  --accent: #0a5c86;
  --accent-soft: #d9ebf4;
  --hot: #c2410c;
  --hot-soft: #fde7da;
  --calm: #2f6f4f;
  --calm-soft: #dcefe4;
  --bar: #0a5c86;
  /* 艇番の公式色 (テーマ共通) */
  --l1: #ffffff; --l1-fg: #111111;
  --l2: #1c1c1c; --l2-fg: #ffffff;
  --l3: #e60012; --l3-fg: #ffffff;
  --l4: #0068b7; --l4-fg: #ffffff;
  --l5: #ffe100; --l5-fg: #111111;
  --l6: #00984a; --l6-fg: #ffffff;
  --chip-ring: #9fb1bc;
  --display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1820; --surface: #12232e; --fg: #e6eef3; --muted: #93a9b6; --line: #243946;
    --accent: #5bb7e5; --accent-soft: #163447; --hot: #fb923c; --hot-soft: #3a2316;
    --calm: #6fcf9d; --calm-soft: #15322a; --bar: #5bb7e5; --chip-ring: #4b6372;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1820; --surface: #12232e; --fg: #e6eef3; --muted: #93a9b6; --line: #243946;
  --accent: #5bb7e5; --accent-soft: #163447; --hot: #fb923c; --hot-soft: #3a2316;
  --calm: #6fcf9d; --calm-soft: #15322a; --bar: #5bb7e5; --chip-ring: #4b6372;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.wrap > * { min-width: 0; }
.num { font-variant-numeric: tabular-nums; }

header { display: flex; flex-direction: column; gap: 4px; }
header h1 { font-family: var(--display); font-weight: 400; font-size: 1.7rem; line-height: 1.2; margin: 0; letter-spacing: .02em; text-wrap: balance; }
header .sub { color: var(--muted); font-size: .85rem; }
.wake { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--l1) 0 16.6%, var(--l2) 0 33.3%, var(--l3) 0 50%, var(--l4) 0 66.6%, var(--l5) 0 83.3%, var(--l6) 0); outline: 1px solid var(--line); }

h2 { font-size: .78rem; letter-spacing: .12em; color: var(--muted); margin: 0 0 8px; font-weight: 700; }

.soon { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.soon button {
  all: unset; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center;
}
.soon button:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.soon .t { font-family: var(--display); font-size: 1.15rem; grid-row: span 2; }
.soon .v { font-weight: 700; }
.soon .p { color: var(--muted); font-size: .82rem; display: flex; gap: 6px; align-items: center; }

.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.tabs button {
  all: unset; cursor: pointer; flex: none; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 700; font-size: .92rem;
}
.tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }

.races { display: flex; flex-direction: column; gap: 14px; }
.race { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.race.done { opacity: .55; }
.race.next { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.race-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rno { font-family: var(--display); font-size: 1.5rem; line-height: 1; }
.rno small { font-size: .9rem; margin-left: 1px; }
.rname { font-weight: 700; }
.meta { color: var(--muted); font-size: .82rem; }
.pill { margin-left: auto; font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.solid { background: var(--calm-soft); color: var(--calm); }
.pill.mixed { background: var(--hot-soft); color: var(--hot); }
.pill.mid { background: var(--accent-soft); color: var(--accent); }
.pill.closed { background: var(--line); color: var(--muted); }

.boats { display: flex; flex-direction: column; gap: 6px; }
.boat { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(70px, 34%) 44px; gap: 10px; align-items: center; }
.lane { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-size: .95rem; box-shadow: inset 0 0 0 1px var(--chip-ring); }
.lane.sm { width: 22px; height: 22px; font-size: .8rem; border-radius: 5px; }
.L1 { background: var(--l1); color: var(--l1-fg); } .L2 { background: var(--l2); color: var(--l2-fg); }
.L3 { background: var(--l3); color: var(--l3-fg); } .L4 { background: var(--l4); color: var(--l4-fg); }
.L5 { background: var(--l5); color: var(--l5-fg); } .L6 { background: var(--l6); color: var(--l6-fg); }
.who { min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.who b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { color: var(--muted); font-size: .75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grade { font-weight: 700; }
.grade.A1 { color: var(--hot); }
.track { height: 10px; background: var(--accent-soft); border-radius: 5px; overflow: hidden; }
.fill { height: 100%; background: var(--bar); border-radius: 5px; }
.boat.top .fill { background: var(--hot); }
.pct { text-align: right; font-weight: 700; font-size: .92rem; }

.tri { border-top: 1px dashed var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.tri-label { font-size: .75rem; color: var(--muted); letter-spacing: .08em; font-weight: 700; }
.combos { display: flex; flex-wrap: wrap; gap: 6px 10px; }
.combo { display: inline-flex; align-items: center; gap: 3px; padding: 4px 8px 4px 4px; border-radius: 8px; background: var(--bg); }
.combo .dash { color: var(--muted); font-size: .7rem; }
.combo .cp { margin-left: 5px; font-size: .82rem; color: var(--muted); font-weight: 700; }
.combo:first-child { background: var(--accent-soft); }
.combo:first-child .cp { color: var(--accent); }

.note { color: var(--muted); font-size: .8rem; line-height: 1.7; border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.note p { margin: 0; max-width: 65ch; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.stats b { color: var(--fg); }
.err { background: var(--hot-soft); color: var(--hot); padding: 12px 14px; border-radius: 10px; }
.loading { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .4s ease; } }
@media (max-width: 420px) { .boat { grid-template-columns: 28px minmax(0, 1fr) 64px 42px; gap: 8px; } }
</style>

<div class="wrap">
  <header>
    <h1>ボートレースAI予想</h1>
    <div class="sub num" id="sub">予想データを読み込んでいます…</div>
    <div class="wake" aria-hidden="true"></div>
  </header>

  <section id="soonSec" hidden>
    <h2>まもなく締切</h2>
    <div class="soon" id="soon"></div>
  </section>

  <section>
    <h2>レース場</h2>
    <div class="tabs" id="tabs" role="toolbar" aria-label="レース場"></div>
  </section>

  <section class="races" id="races"><p class="loading">読み込み中…</p></section>

  <footer class="note" id="note"></footer>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const pct = (p, d = 0) => (p * 100).toFixed(d) + "%";
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const laneChip = (n, sm) => `<span class="lane L${n}${sm ? " sm" : ""}">${n}</span>`;

  function jstNow() {
    const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
    const g = (t) => parts.find((p) => p.type === t).value;
    return { date: `${g("year")}-${g("month")}-${g("day")}`, time: `${g("hour").replace("24", "00")}:${g("minute")}` };
  }

  function confidence(race) {
    const top = Math.max(...race.boats.map((b) => b.p_win));
    if (top >= 0.6) return ["solid", "堅い"];
    if (top >= 0.4) return ["mid", "本命あり"];
    return ["mixed", "混戦"];
  }

  let data, current, now;

  function status(race) {
    if (!now || now.date !== data.date || !race.deadline) return "open";
    return race.deadline <= now.time ? "done" : "open";
  }

  function renderSoon() {
    const list = [];
    data.venues.forEach((v) => v.races.forEach((r) => { if (status(r) === "open" && now.date === data.date) list.push([v, r]); }));
    list.sort((a, b) => a[1].deadline.localeCompare(b[1].deadline));
    const pick = list.slice(0, 4);
    $("soonSec").hidden = pick.length === 0;
    $("soon").innerHTML = pick.map(([v, r]) => {
      const fav = r.boats.reduce((a, b) => (b.p_win > a.p_win ? b : a));
      return `<button type="button" data-v="${v.code}" data-r="${r.no}">
        <span class="t num">${esc(r.deadline)}</span>
        <span class="v">${esc(v.name)} ${r.no}R</span>
        <span class="p">本命 ${laneChip(fav.lane, true)} ${esc(fav.name)} <span class="num">${pct(fav.p_win)}</span></span>
      </button>`;
    }).join("");
    $("soon").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => select(+b.dataset.v, +b.dataset.r)));
  }

  function renderTabs() {
    $("tabs").innerHTML = data.venues.map((v) =>
      `<button type="button" data-v="${v.code}" aria-pressed="${v.code === current}">${esc(v.name)}</button>`).join("");
    $("tabs").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => select(+b.dataset.v)));
  }

  function renderRaces(scrollTo) {
    const v = data.venues.find((x) => x.code === current);
    const nextNo = (v.races.find((r) => status(r) === "open") || {}).no;
    $("races").innerHTML = v.races.map((r) => {
      const st = status(r);
      const [cls, label] = st === "done" ? ["closed", "締切"] : confidence(r);
      const max = Math.max(...r.boats.map((b) => b.p_win));
      const isNext = st === "open" && r.no === nextNo && now.date === data.date;
      return `<article class="race ${st === "done" ? "done" : ""} ${isNext ? "next" : ""}" id="r${r.no}">
        <div class="race-head">
          <span class="rno num">${r.no}<small>R</small></span>
          <span class="rname">${esc(r.name || "")}</span>
          <span class="meta num">締切 ${esc(r.deadline || "-")}${r.distance ? " ・ " + r.distance + "m" : ""}</span>
          <span class="pill ${cls}">${label}</span>
        </div>
        <div class="boats">${r.boats.map((b) => `
          <div class="boat ${b.p_win === max ? "top" : ""}">
            ${laneChip(b.lane)}
            <div class="who"><b>${esc(b.name)}</b><span><span class="grade ${esc(b.grade)}">${esc(b.grade)}</span> ・ ${esc(b.branch)} ・ 勝率 <span class="num">${b.nat_win.toFixed(2)}</span> ・ モーター <span class="num">${b.motor_2.toFixed(0)}%</span></span></div>
            <div class="track" aria-hidden="true"><div class="fill" style="width:${(b.p_win / max) * 100}%"></div></div>
            <div class="pct num" aria-label="${b.lane}号艇の1着確率">${pct(b.p_win)}</div>
          </div>`).join("")}
        </div>
        <div class="tri">
          <div class="tri-label">3連単 AI上位5点</div>
          <div class="combos">${r.trifecta.slice(0, 5).map((t) =>
            `<span class="combo">${t.combo.split("-").map((n) => laneChip(n, true)).join('<span class="dash">→</span>')}<span class="cp num">${pct(t.prob, 1)}</span></span>`).join("")}
          </div>
        </div>
      </article>`;
    }).join("");
    if (scrollTo) document.getElementById("r" + scrollTo)?.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function select(code, raceNo) {
    current = code;
    if (location.hash !== "#v" + code) history.replaceState(null, "", "#v" + code);
    renderTabs();
    renderRaces(raceNo);
  }

  function renderNote() {
    const m = data.model || {};
    const s = (k) => (m[k] != null ? pct(m[k], 1) : "-");
    $("note").innerHTML = `
      <div class="stats num">
        <span>学習レース数 <b>${(m.train_races ?? 0).toLocaleString()}</b></span>
        <span>テスト ${(m.test_races ?? 0).toLocaleString()}R: AI本命の1着的中 <b>${s("top1_acc")}</b> / 1号艇固定 <b>${s("lane1_acc")}</b></span>
        <span>単勝回収率 <b>${s("win_roi")}</b></span>
      </div>
      <p>試験版です。学習データがまだ少ないため、予想の精度は確かめられていません。舟券の購入は自己判断でお願いします。</p>
      <p>確率は番組表(級別・勝率・モーター・ボート)と過去の成績から計算しています。展示タイムやオッズは使っていません。</p>`;
  }

  function boot() {
    fetch("predictions.json", { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((d) => {
        data = d; now = jstNow();
        const [y, mo, da] = d.date.split("-");
        const nRaces = d.venues.reduce((a, v) => a + v.races.length, 0);
        $("sub").textContent = `${+y}年${+mo}月${+da}日 ・ ${d.venues.length}場 ${nRaces}レース ・ ${d.generated_at.slice(11, 16)} 更新`;
        const fromHash = +(location.hash.match(/^#v(\d+)$/) || [])[1];
        const firstOpen = d.venues.find((v) => v.races.some((r) => status(r) === "open"));
        current = d.venues.some((v) => v.code === fromHash) ? fromHash : (firstOpen || d.venues[0]).code;
        renderSoon(); renderTabs(); renderRaces(); renderNote();
        setInterval(() => { now = jstNow(); renderSoon(); renderRaces(); }, 60000);
      })
      .catch(() => {
        $("races").innerHTML = '<p class="err">予想データを読み込めませんでした。ページを再読み込みしてください。直らない場合は、予想データがまだ作られていない可能性があります。</p>';
        $("sub").textContent = "";
      });
  }
  boot();
})();
</script>
