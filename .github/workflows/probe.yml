name: シグナルの中継役を確かめる
on:
  push:
    branches: [claude/connection-check-m84res]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 60
          for i in 1 2 3 4; do echo "結果 $(date +%T) $(curl -s "https://project-fx-24u.pages.dev/api/price?symbol=XAG%2FUSD&_=$i" | head -c 90)"; sleep 6; done
