name: 経済指標と金利のデータを取得
# 公開データを読んで data/ に保存するだけ
on:
  push:
    branches: [claude/connection-check-m84res]
    paths: [".github/workflows/fetch-macro.yml", "scripts/fetch-macro.mjs"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/fetch-macro.mjs
      - name: data/ を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "経済指標と金利のデータを更新"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
