<title>中央競馬 複勝AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: 上に日付と更新、場チップとレース番号、真ん中に1レースを大きく、下にタブバー。芝の緑と枠の8色が主役(ボートAIと同じ作り) */
:root {
  --bg: #ffffff; --surface: #ffffff; --fg: #14241a; --muted: #5d6e62; --line: #d5e0d6;
  --accent: #1d6b3c; --accent-fg: #ffffff; --accent-soft: #dcede1;
  --hot: #c2410c; --hot-soft: #fde7da; --good: #1d6b3c; --good-soft: #dcefe2;
  --bad: #9b1c1c; --bad-soft: #fbe2e2; --nav: #ffffffee; --gold: #a16207; --gold-soft: #fbf0cf;
  --w1: #ffffff; --w1-fg: #111; --w2: #1c1c1c; --w2-fg: #fff; --w3: #e60012; --w3-fg: #fff; --w4: #0068b7; --w4-fg: #fff;
  --w5: #ffe100; --w5-fg: #111; --w6: #00984a; --w6-fg: #fff; --w7: #f39800; --w7-fg: #111; --w8: #f29ec0; --w8-fg: #111;
  --display: var(--body);
  --body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  --navh: 64px; color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.55;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(var(--navh) + env(safe-area-inset-bottom, 0px) + 24px); }
button { font: inherit; color: inherit; }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
.wrap > * { min-width: 0; }
.num { font-variant-numeric: tabular-nums; }
.btn { all: unset; cursor: pointer; box-sizing: border-box; }
.btn:focus-visible, select:focus-visible, nav.tabs a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
/* ヘッダー */
.top { display: flex; align-items: center; gap: 10px; }
.top h1 { font-family: var(--display); font-weight: 700; font-size: 1.1rem; margin: 0; line-height: 1.2; white-space: nowrap; }
.top .upd { font-size: .7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top .rf { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); font-weight: 700; font-size: .8rem; white-space: nowrap; }
.top .rf[aria-disabled="true"] { opacity: .55; cursor: default; }
.top .tag { font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); }
.top select { margin-left: auto; font: inherit; font-weight: 700; font-size: .85rem; padding: 4px 26px 4px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: right 12px center, right 7px center; background-size: 5px 5px; background-repeat: no-repeat; }
.refresh { display: flex; align-items: center; gap: 8px; margin-top: -6px; font-size: .75rem; color: var(--muted); }
.refresh .btn { margin-left: auto; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); font-weight: 700; font-size: .75rem; }
.refresh .btn[aria-disabled="true"] { opacity: .55; cursor: default; }
.stripe { height: 5px; border-radius: 3px; box-shadow: 0 0 0 1px var(--line);
  background: linear-gradient(90deg, var(--w1) 0 12.5%, var(--w2) 0 25%, var(--w3) 0 37.5%, var(--w4) 0 50%, var(--w5) 0 62.5%, var(--w6) 0 75%, var(--w7) 0 87.5%, var(--w8) 0); }
.label { font-size: .75rem; letter-spacing: .12em; color: var(--muted); font-weight: 700; margin: 0 0 6px; }
/* 枠色の馬番 */
.uma { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 7px; font-weight: 700; font-size: .95rem;
  font-variant-numeric: tabular-nums; box-shadow: inset 0 0 0 1px #0002; flex: none; }
.uma.sm { width: 22px; height: 22px; font-size: .75rem; border-radius: 5px; }
.W1 { background: var(--w1); color: var(--w1-fg); box-shadow: inset 0 0 0 1px #0004; } .W2 { background: var(--w2); color: var(--w2-fg); }
.W3 { background: var(--w3); color: var(--w3-fg); } .W4 { background: var(--w4); color: var(--w4-fg); }
.W5 { background: var(--w5); color: var(--w5-fg); } .W6 { background: var(--w6); color: var(--w6-fg); }
.W7 { background: var(--w7); color: var(--w7-fg); } .W8 { background: var(--w8); color: var(--w8-fg); }
/* 場チップ */
.venues { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.venues::-webkit-scrollbar { display: none; }
.venue { flex: none; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; line-height: 1.25; min-width: 76px; text-align: left; }
.venue b { font-size: 1rem; } .venue span { font-size: .72rem; color: var(--muted); }
.venue[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.venue[aria-pressed="true"] span { color: var(--accent-fg); opacity: .85; }
/* レース番号 */
.rgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.rbtn { position: relative; text-align: center; padding: 3px 0 2px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); line-height: 1.15; }
.rbtn b { display: block; font-family: var(--display); font-weight: 700; font-size: .95rem; }
.rbtn span { font-size: .68rem; color: var(--muted); }
.rbtn.done { opacity: .5; }
.rbtn.next { border-color: var(--hot); box-shadow: inset 0 0 0 1px var(--hot); }
.rbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); opacity: 1; box-shadow: none; }
.rbtn[aria-pressed="true"] span { color: var(--accent-fg); }
.rbtn .vdot { position: absolute; top: 4px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
/* レース詳細 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.rhead { display: flex; align-items: flex-start; gap: 8px 12px; flex-wrap: wrap; }
.rhead .big { font-family: var(--display); font-weight: 700; font-size: 2.1rem; line-height: 1; }
.rhead .big small { font-size: 1rem; }
.rhead .info { display: flex; flex-direction: column; min-width: 0; flex: 1 1 10em; }
.rhead .info b { font-size: 1.05rem; } .rhead .info span { color: var(--muted); font-size: .85rem; }
.rhead .info .rn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pays { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
@media (min-width: 560px) { .pays { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kb { background: var(--accent-soft); border-radius: 8px; padding: 3px 6px 4px; min-width: 0; }
.kb.wide { grid-column: span 2; }
@media (min-width: 560px) { .kb.wide { grid-column: auto; } }
.kb .uma.sm { width: 19px; height: 19px; font-size: .68rem; border-radius: 4px; }
.kb .k { font-weight: 700; color: var(--accent); font-size: .72rem; }
.pay { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 4px; padding: 1px 0; }
.pay .c { display: flex; align-items: center; gap: 1px; flex: none; }
.pay .c .arrow { color: var(--muted); font-size: .65rem; padding: 0 1px; }
.pay .y { margin-left: auto; font-weight: 700; font-size: .8rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pay .y small { font-size: .65rem; font-weight: 500; }
.pill { font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.value { background: var(--gold); color: #fff; } .pill.closed { background: var(--line); color: var(--muted); }
.pill.hit { background: var(--good-soft); color: var(--good); } .pill.miss { background: var(--line); color: var(--muted); }
.result { border-radius: 10px; background: var(--accent-soft); padding: 8px 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.result .t { font-size: .7rem; font-weight: 700; color: var(--accent); }
.result .arrow { color: var(--muted); font-size: .7rem; }
.horses { display: flex; flex-direction: column; }
.horse { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.horse:last-child { border-bottom: 0; }
.horse.pick { background: linear-gradient(90deg, var(--gold-soft), transparent 70%); margin-inline: -12px; padding-inline: 12px; }
.horse.scr { opacity: .45; }
.horse .who { min-width: 0; }
.horse .who .nm { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.horse .who b { font-size: .98rem; line-height: 1.25; }
.horse .facts { display: flex; flex-wrap: wrap; gap: 0 8px; font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.horse .fin { font-weight: 700; font-size: .75rem; padding: 0 6px; border-radius: 999px; background: var(--line); color: var(--muted); }
.horse .fin.top { background: var(--good-soft); color: var(--good); }
.horse .ev { text-align: right; font-variant-numeric: tabular-nums; line-height: 1.2; }
.horse .ev b { font-family: var(--display); font-weight: 700; font-size: 1.15rem; }
.horse .ev small { display: block; font-size: .65rem; color: var(--muted); }
.horse.pick .ev b { color: var(--gold); }
.bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
/* 期待値タブ */
.evcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.evcard.done { opacity: .85; }
.evhead { width: 100%; display: flex; align-items: center; gap: 8px; padding: 4px 12px; background: var(--accent-soft); font-size: .85rem; }
.evhead b { font-weight: 700; } .evhead .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.evhead .go { margin-left: auto; color: var(--accent); font-weight: 700; font-size: .75rem; }
.evrow { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 12px; border-top: 1px solid var(--line); }
.evrow .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.evrow .right { text-align: right; display: flex; align-items: center; gap: 6px; }
.evrow .right b { font-family: var(--display); font-weight: 700; font-size: 1.25rem; color: var(--gold); line-height: 1.1; }
.res { font-size: .68rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.res.hit { background: var(--good-soft); color: var(--good); } .res.miss { background: var(--line); color: var(--muted); }
/* 成績タブ */
.summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stat span { font-size: .75rem; color: var(--muted); font-weight: 700; }
.stat b { font-family: var(--display); font-weight: 700; font-size: 1.45rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat b.plus { color: var(--good); } .stat b.minus { color: var(--bad); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.list h3 { margin: 0; padding: 7px 12px; font-size: .85rem; background: var(--accent-soft); color: var(--accent); display: flex; gap: 8px; }
.list h3 span { margin-left: auto; font-variant-numeric: tabular-nums; }
.krow { width: 100%; display: grid; grid-template-columns: 64px 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 12px; border-top: 1px solid var(--line); font-size: .85rem; }
.krow:first-of-type { border-top: 0; }
.krow .r { font-weight: 700; font-variant-numeric: tabular-nums; }
.krow .nm { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.krow .y { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); text-align: center; padding: 28px 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }
.note { color: var(--muted); font-size: .8rem; line-height: 1.7; margin: 0; }
/* 下のタブバー */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--nav); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
nav.tabs .in { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; max-width: 720px; height: var(--navh); }
nav.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); text-decoration: none; font-size: .75rem; font-weight: 700; position: relative; }
nav.tabs a svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs a[aria-current="page"] { color: var(--accent); }
nav.tabs .badge { position: absolute; top: 8px; left: calc(50% + 6px); background: var(--gold); color: #fff; font-size: .65rem; border-radius: 999px; padding: 0 6px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
</style>

<div class="wrap">
  <div class="top">
    <h1>複勝AI</h1><span id="updated" class="upd"></span>
    <select id="daySel" aria-label="日付"></select>
    <button id="refreshBtn" class="btn rf" type="button" hidden>更新</button>
  </div>
  <main id="main"><p class="note">読み込み中…</p></main>
</div>
<nav class="tabs" aria-label="メニュー">
  <div class="in">
    <a href="#kitai" data-tab="kitai"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M6 15l4-4 3 3 5-6"/><path d="M15 8h3v3"/></svg>期待値<span class="badge" id="evBadge" hidden></span></a>
    <a href="#race" data-tab="race"><svg viewBox="0 0 24 24"><path d="M4 18c0-3 2-5 5-5h4l3-4 2 1-1 3 2 2-1 3"/><path d="M7 13l-1-4 3-1"/><path d="M6 18v2M16 18v2"/></svg>レース</a>
    <a href="#seiseki" data-tab="seiseki"><svg viewBox="0 0 24 24"><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 12v4M8 20h8M10 16h4v4h-4z"/></svg>成績</a>
  </div>
</nav>

<script>
(function () {
  "use strict";
  const DATA = /*__DATA__*/null;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pct = (x) => (x == null ? "-" : (x * 100).toFixed(0) + "%");
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
  const days = (DATA && DATA.days) || [];
  const S = { day: days.length ? days[days.length - 1].date : null, venue: store.get("jvenue", null), race: null };
  $("updated").textContent = DATA ? `${DATA.updated.split(" ")[1]} 時点` : "データなし";

  // 枠番: 8頭以下は馬番=枠。9頭以上は外の枠から2頭ずつ入る(JRAの決まり)
  function waku(no, n) {
    if (!n || n <= 8) return Math.min(no, 8);
    const base = Math.floor(n / 8), extra = n % 8;
    let s = 0;
    for (let w = 1; w <= 8; w++) { s += base + (w > 8 - extra ? 1 : 0); if (no <= s) return w; }
    return 8;
  }
  const uma = (no, n, sm) => `<span class="uma W${waku(no, n)}${sm ? " sm" : ""}">${no}</span>`;

  const fmtDate = (d) => { const t = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8)); return `${t.getMonth() + 1}/${t.getDate()}(${WEEK[t.getDay()]})`; };
  const sel = $("daySel");
  sel.innerHTML = days.map((d) => `<option value="${d.date}">${fmtDate(d.date)}</option>`).join("");
  sel.value = S.day || "";
  sel.hidden = days.length < 1;
  sel.addEventListener("change", () => { S.day = sel.value; S.race = null; render(); });

  const curDay = () => days.find((d) => d.date === S.day);
  const isLatest = () => days.length && S.day === days[days.length - 1].date;
  const nowHM = () => { const t = new Date(Date.now() + (new Date().getTimezoneOffset() + 540) * 60000); return t.toTimeString().slice(0, 5); };
  const picksOf = (r) => (r.result ? r.picks : r.horses.filter((h) => h.pick));
  const resTag = (p) => p.pay == null ? "" : p.pay > 0 ? `<span class="res hit">的中 ${p.pay}円</span>` : `<span class="res miss">はずれ</span>`;
  const oddsNote = (lab, at) => lab === "確定" ? "確定オッズ" : lab === "朝" ? `${esc(at)} 朝の参考値` : at ? `${esc(at)} のオッズ` : "オッズ未取得";
  const nextRace = (races) => { const now = nowHM(); return isLatest() ? races.find((r) => !r.result && r.post >= now) : null; };

  // ---------- 期待値タブ ----------
  function renderKitai() {
    const d = curDay();
    if (!d) return `<p class="empty">中央競馬の開催がありません。</p>`;
    const nx = nextRace(d.races);
    const list = d.races.filter((r) => picksOf(r).length).sort((a, b) => (a.post < b.post ? -1 : 1));
    const live = list.filter((r) => !r.result), done = list.filter((r) => r.result);
    const card = (r) => {
      const ps = picksOf(r);
      return `<div class="evcard${r.result ? " done" : ""}">
        <button class="btn evhead" type="button" data-go="${r.rid}"><b>${esc(r.venue)}${r.race_no}R</b><span class="t">${esc(r.post)}発走</span>
          ${r === nx ? `<span class="pill value">次</span>` : ""}<span class="go">›</span></button>
        ${ps.map((h) => `<div class="evrow">${uma(h.no, r.n)}
          <div style="min-width:0"><b>${esc(h.name)}</b>
            <div class="n">複勝${h.fmin}〜${h.fmax} ・ 3着内${pct(h.p_top)} ・ 単勝${h.tan}${(h.label || r.label) === "朝" ? " ・ 朝の参考値" : ""}</div></div>
          <div class="right"><b>${h.ev.toFixed(2)}</b>${resTag(h)}</div></div>`).join("")}
      </div>`;
    };
    const note = `<p class="note">期待値 = 3着内の確率 × 複勝オッズの下限。1.0以上を表示(検証中)。</p>`;
    let html = "";
    if (live.length) html += `<div><p class="label">これから</p><div style="display:grid;gap:6px">${live.map(card).join("")}</div></div>`;
    if (done.length) html += `<div><p class="label">終わったレース</p><div style="display:grid;gap:6px">${done.map(card).join("")}</div></div>`;
    if (!html) html = `<p class="empty">いまは期待値1.0以上の複勝がありません。</p>`;
    return `<div style="display:grid;gap:14px">${html}${note}</div>`;
  }

  // ---------- レースタブ ----------
  function renderRace() {
    const d = curDay();
    if (!d) return `<p class="empty">中央競馬の開催がありません。</p>`;
    const venues = [...new Set(d.races.map((r) => r.venue))];
    if (!venues.includes(S.venue)) S.venue = venues[0];
    const races = d.races.filter((r) => r.venue === S.venue).sort((a, b) => a.race_no - b.race_no);
    const nx = nextRace(races);
    let r = races.find((x) => x.rid === S.race) || nx || races[races.length - 1];
    S.race = r.rid;
    const vchips = venues.map((v) => {
      const rs = d.races.filter((x) => x.venue === v);
      const left = rs.filter((x) => !x.result).length, cand = rs.reduce((s, x) => s + picksOf(x).length, 0);
      return `<button class="btn venue" type="button" data-venue="${esc(v)}" aria-pressed="${v === S.venue}"><b>${esc(v)}</b><span>${left ? `残り${left}R` : "終了"}${cand ? ` ・ 候補${cand}` : ""}</span></button>`;
    }).join("");
    const grid = races.map((x) => `<button class="btn rbtn${x.result ? " done" : ""}${x === nx ? " next" : ""}" type="button" data-race="${x.rid}" aria-pressed="${x === r}">
      ${picksOf(x).length ? `<i class="vdot" aria-label="候補あり"></i>` : ""}<b>${x.race_no}R</b><span>${esc(x.post)}</span></button>`).join("");
    return `<div class="venues">${vchips}</div><div class="rgrid" style="margin-bottom:14px">${grid}</div>${raceCard(r)}`;
  }

  function raceCard(r) {
    const res = r.result;
    const ps = picksOf(r);
    let pill = "";
    if (res) pill = ps.length ? (ps.some((p) => p.pay > 0) ? `<span class="pill hit">候補的中</span>` : `<span class="pill miss">候補はずれ</span>`) : `<span class="pill closed">確定</span>`;
    else if (ps.length) pill = `<span class="pill value">候補${ps.length}頭</span>`;
    let resLine = "";
    if (res && r.pays && r.pays.length) {
      const combo = (kind, num) => num.split("-").map((x) => kind === "枠連" ? `<span class="uma sm W${x}">${x}</span>` : uma(+x, r.n, true)).join('<span class="arrow">' + (kind === "馬単" || kind === "3連単" ? "›" : "-") + "</span>");
      resLine = `<div class="pays">${["単勝", "複勝", "枠連", "馬連", "ワイド", "馬単", "3連複", "3連単"].map((n) => r.pays.find((k) => k.kind === n)).filter(Boolean).map((k) => `<div class="kb${k.kind === "3連単" ? " wide" : ""}"><div class="k">${esc(k.kind)}</div>${k.lines.map((l) => `<div class="pay">
        <span class="c">${combo(k.kind, l.num)}</span><span class="y">${l.yen.toLocaleString()}<small>円</small></span></div>`).join("")}</div>`).join("")}</div>`;
    }
    const maxp = Math.max(...r.horses.map((h) => h.p_top || 0), 0.01);
    const rows = r.horses.map((h) => {
      const f = res && res[String(h.no)];
      const fin = f ? (f.status ? `<span class="fin">${esc(f.status)}</span>` : `<span class="fin${f.finish <= 3 ? " top" : ""}">${f.finish}着</span>`) : "";
      return `<div class="horse${h.pick ? " pick" : ""}">${uma(h.no, r.n)}
        <div class="who"><div class="nm"><b>${esc(h.name)}</b>${fin}</div>
          <div class="facts"><span>${esc(h.jockey)}</span><span>単勝 ${h.tan}倍</span><span>複勝 ${h.fmin ?? "-"}〜${h.fmax ?? "-"}</span><span>3着内 ${pct(h.p_top)}</span></div>
          <div class="bar"><i style="width:${((h.p_top || 0) / maxp * 100).toFixed(0)}%"></i></div></div>
        <div class="ev"><b>${h.ev != null ? h.ev.toFixed(2) : "-"}</b><small>期待値</small></div></div>`;
    }).join("");
    return `<div class="card">
      <div class="rhead"><div class="info"><b>${esc(r.venue)}${r.race_no}R ・ ${esc(r.post)}発走 ・ ${esc(r.course)}</b><span class="rn">${esc(r.name)}</span></div>${pill}</div>
      ${resLine}
      ${r.horses.length ? `<div class="horses">${rows}</div>` : `<p class="empty">まだオッズがありません。</p>`}
      <p class="note">${oddsNote(r.label, r.at)} ・ 金色の行が期待値1.0以上の候補</p></div>`;
  }

  // ---------- 成績タブ ----------
  function renderSeiseki() {
    const all = [];
    for (const d of days) for (const r of d.races) for (const p of r.picks) if (p.pay != null) all.push({ ...p, date: d.date, r });
    const n = all.length, hit = all.filter((p) => p.pay > 0).length, ret = all.reduce((s, p) => s + p.pay, 0), bal = ret - n * 100;
    const sum = `<div class="summary">
      <div class="stat"><span>回収率</span><b>${n ? Math.round(ret / n) + "%" : "-"}</b></div>
      <div class="stat"><span>収支</span><b class="${bal >= 0 ? "plus" : "minus"}">${n ? (bal >= 0 ? "+" : "") + bal.toLocaleString() + "円" : "-"}</b></div>
      <div class="stat"><span>買った数(各100円)</span><b>${n}点</b></div>
      <div class="stat"><span>的中</span><b>${hit}点${n ? ` <small style="font-size:.8rem">(${Math.round(hit / n * 100)}%)</small>` : ""}</b></div></div>`;
    const byDay = days.slice().reverse().map((d) => {
      const ps = all.filter((p) => p.date === d.date);
      if (!ps.length) return "";
      const rt = ps.reduce((s, p) => s + p.pay, 0);
      return `<div class="list"><h3>${fmtDate(d.date)}<span>${ps.length}点 ・ 回収率 ${Math.round(rt / ps.length)}%</span></h3>
        ${ps.map((p) => `<button class="btn krow" type="button" data-day="${d.date}" data-go="${p.r.rid}"><span class="r">${esc(p.r.venue)}${p.r.race_no}R</span>${uma(p.no, p.r.n, true)}
          <span class="nm">${esc(p.name)} <span style="color:var(--muted);font-size:.75rem">期待値${p.ev.toFixed(2)}</span></span>
          <span class="y">${p.pay > 0 ? `<span class="res hit">${p.pay}円</span>` : `<span class="res miss">はずれ</span>`}</span></button>`).join("")}</div>`;
    }).join("");
    const note = `<p class="note">締切5分前のオッズで期待値1.0以上だった複勝を、各100円買ったとしたときの記録です。数百点たまるまでは偶然の差が大きいので、回収率は参考程度に見てください。</p>`;
    return `<div style="display:grid;gap:14px">${sum}${n ? byDay : `<p class="empty">まだ結果の出た候補がありません。</p>`}${note}</div>`;
  }

  function render() {
    const tab = ["kitai", "race", "seiseki"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "kitai";
    document.querySelectorAll("nav.tabs a").forEach((a) => a.setAttribute("aria-current", a.dataset.tab === tab ? "page" : "false"));
    const d = curDay();
    const nLive = d ? d.races.filter((r) => !r.result).reduce((s, r) => s + r.horses.filter((h) => h.pick).length, 0) : 0;
    $("evBadge").hidden = !nLive; $("evBadge").textContent = nLive;
    $("main").innerHTML = tab === "race" ? renderRace() : tab === "seiseki" ? renderSeiseki() : renderKitai();
  }
  $("main").addEventListener("click", (e) => {
    const v = e.target.closest("[data-venue]");
    if (v) { S.venue = v.dataset.venue; S.race = null; store.set("jvenue", S.venue); render(); return; }
    const rb = e.target.closest("[data-race]");
    if (rb) { S.race = rb.dataset.race; render(); return; }
    const go = e.target.closest("[data-go]");
    if (go) {
      if (go.dataset.day) { S.day = go.dataset.day; sel.value = S.day; }
      const r = curDay().races.find((x) => x.rid === go.dataset.go);
      if (r) { S.venue = r.venue; S.race = r.rid; }
      if (location.hash === "#race") render(); else location.hash = "#race";
      window.scrollTo(0, 0);
    }
  });
  window.addEventListener("hashchange", render);
  render();

  // 「最新にする」: ルーティンを動かして Claude に最新版を公開してもらう
  const REFRESH_TRIGGER = "trig_013oAwzS52ZmD2Enm55NcCUS";
  (async function () {
    for (let i = 0; i < 20 && !window.claude; i++) await new Promise((ok) => setTimeout(ok, 500));
    if (!window.claude) return;
    let mcp = null;
    try { mcp = await window.claude.use("mcp"); } catch (e) { mcp = null; }
    if (!mcp) return;
    const btn = $("refreshBtn"), msg = $("updated");
    btn.hidden = false;
    let busy = false;
    btn.addEventListener("click", async () => {
      if (busy) return;
      busy = true; btn.setAttribute("aria-disabled", "true"); btn.textContent = "…";
      try {
        await mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: REFRESH_TRIGGER }, { cache: false });
        msg.textContent = "1〜2分で更新";
        btn.textContent = "依頼済み";
      } catch (e) {
        msg.textContent = "失敗。もう一度";
        busy = false; btn.removeAttribute("aria-disabled"); btn.textContent = "更新";
      }
    });
  })();
})();
</script>
