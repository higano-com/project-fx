name: シグナルの中継役を確かめる
on:
  push:
    branches: [claude/connection-check-m84res]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 60
          for u in "api/price?symbol=XAG%2FUSD" "api/price?symbol=USD%2FJPY" "api/series?symbol=XAG%2FUSD&interval=1min" "api/series?symbol=XAG%2FUSD&interval=1h" "api/series?symbol=XAG%2FUSD&interval=1day"; do
            echo "結果 $u"; curl -s -m 20 "https://project-fx-24u.pages.dev/$u" | head -c 160; echo
          done
          echo "結果 画面"; curl -s https://project-fx-24u.pages.dev/ | grep -o "<title>[^<]*</title>\|signal-[0-9]*" | head -3; curl -s https://project-fx-24u.pages.dev/sw.js | grep -o "signal-[0-9]*" | head -1
