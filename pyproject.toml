[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boatrace-ai"
version = "0.1.0"
description = "ボートレース着順予測AI (LightGBM + Harville)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "lhafile>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
boatrace-ai = "boatrace_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
