name: 見張り役の様子を確かめる
# 見張り役（クラウドフレアのワーカー）の画面を読んで data/raw/worker-check.txt に保存するだけ
on:
  push:
    branches: [claude/connection-check-m84res]
    paths: [".github/workflows/check-worker.yml", "data/REQUEST-check.md"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 見張り役を読む
        run: |
          sleep 90   # 見張り役の更新が終わるのを待つ
          mkdir -p data/raw
          W=https://kingin-mihari.higano-com.workers.dev
          {
            echo "確かめた時刻: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for p in / /status /demo /run /status /demo; do
              echo "=== $p"; curl -sS -m 60 "$W$p"; echo
            done
          } > data/raw/worker-check.txt 2>&1
          cat data/raw/worker-check.txt
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/worker-check.txt
          git commit -m "見張り役の様子を確かめた結果" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
