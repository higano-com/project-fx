<title>シグナル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 画面の考え方：一番上に「今の価格」と「判断」を大きく。説明は「くわしく」を開いたときだけ。文字は大きく、押す場所も大きく。 */
:root{
  --bg:#000000; --surface:#111317; --sunk:#1D2026; --ink:#F3F5F8; --muted:#8C949F; --line:#242830;
  --gold:#E2B754; --gold-soft:#2F2815; --silver:#B6C2CE; --silver-soft:#232A31;
  --buy:#FF5A4E; --buy-soft:#3A1411; --sell:#3DA2FF; --sell-soft:#0D2236; --wait:#8C949F; --wait-soft:#1A1D22;
  --warn:#F2C14E; --warn-soft:#2E250D; --ok:#3FD68D;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
h2{font-size:16px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.up{color:var(--buy)} .down{color:var(--sell)} .muted{color:var(--muted)}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:640px;margin:0 auto}

/* 上の帯：銘柄の切り替えと、データの状態 */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.metal{display:flex;flex:1;background:var(--sunk);border-radius:12px;padding:4px;gap:4px;min-width:0}
.metal button{flex:1;border:0;background:transparent;padding:7px 6px;border-radius:9px;font-weight:700;font-size:15px;cursor:pointer;color:var(--muted)}
.metal button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .14)}
.metal button[data-sym="gold"][aria-pressed="true"]{color:var(--gold)}
.metal button[data-sym="silver"][aria-pressed="true"]{color:var(--silver)}
.status{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--warn)}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.status.live{color:var(--ok)}

main{padding-block:4px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:12px}

.card{background:var(--surface);border-radius:16px;padding:14px}
.card > * + *{margin-top:12px}
.sub{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.7}

/* 細い帯の知らせ（サンプル・停止中など） */
.banner{display:flex;gap:8px;align-items:flex-start;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6}
.banner.warn{background:var(--warn-soft)} .banner.warn b{color:var(--warn)}
.banner.stop{background:var(--warn-soft)} .banner.stop b{color:var(--warn)}

/* いちばん上：価格と判断 */
.hero{padding:0;overflow:hidden}
.hero .price-area{padding:16px 16px 12px}
.hero .label{font-size:13px;color:var(--muted)}
.price{font-family:var(--f-num);font-size:42px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.chg{display:inline-flex;gap:6px;align-items:baseline;font-family:var(--f-num);font-size:15px;font-weight:600;margin-top:6px}
.chg small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.decision{padding:16px;display:flex;flex-direction:column;gap:10px}
.decision.buy{background:var(--buy-soft)} .decision.sell{background:var(--sell-soft)} .decision.wait{background:var(--wait-soft)}
.decision .word{font-size:30px;font-weight:700;line-height:1.2}
.decision.buy .word{color:var(--buy)} .decision.sell .word{color:var(--sell)} .decision.wait .word{color:var(--ink)}
.decision .why{font-size:15px}
.dots{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);font-family:var(--f-num)}
.dots span{margin-left:4px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);display:inline-block;opacity:.6}
.dots .gap{width:6px}
.dots i.on{opacity:1;border-color:transparent}
.dots i.on{background:var(--buy)}
.decision.sell .dots i.on{background:var(--sell)}

.btn{border:0;background:var(--sunk);border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;min-height:46px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn.buy{background:var(--buy);color:#fff} .btn.sell{background:var(--sell);color:#fff}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.small{min-height:38px;padding:8px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;min-height:50px;font-size:16px}

/* 候補価格 */
.lvrows{display:flex;flex-direction:column}
.lvrow{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.lvrow:first-child{border-top:0;padding-top:0}
.lvrow .k{font-size:15px;font-weight:700}
.lvrow .k small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.lvrow .v{font-family:var(--f-num);font-size:22px;font-weight:600;text-align:right}
.lvrow .v small{display:block;font-size:13px;font-weight:500}
.lvrow.tp .k{color:var(--buy)} .lvrow.sl .k{color:var(--sell)}

/* 売値・買値（GMOの画面と同じ並び：左が売、右が買） */
.quotes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{border-radius:14px;padding:10px 8px;text-align:center}
.q.sell{background:var(--sell-soft)} .q.buy{background:var(--buy-soft)}
.q .k{font-size:12px;font-weight:700} .q.sell .k{color:var(--sell)} .q.buy .k{color:var(--buy)}
.q .v{font-family:var(--f-num);font-size:clamp(20px,6vw,26px);font-weight:600;letter-spacing:-.01em;line-height:1.25}
.qsub{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-family:var(--f-num)}
.stamp{border:0;background:var(--sunk);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:12px;font-family:var(--f-num);cursor:pointer;line-height:1.6}
/* 試算 */
.sim{display:flex;flex-direction:column;gap:10px}
.simrow{display:grid;grid-template-columns:5.5em 1fr;gap:10px;align-items:center}
.simrow label{font-size:14px;color:var(--muted);font-weight:700}
.simrow input{width:100%;font-family:var(--f-num);font-size:20px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:right}
.simchips{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.simout{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;background:var(--sunk);border-radius:12px;padding:12px}
.simout .k{font-size:13px;color:var(--muted)} .simout .v{font-family:var(--f-num);font-size:16px;text-align:right}
.simout .v.big2{font-size:28px;font-weight:600}
/* 価格と判断を1枚に */
.panel{background:var(--surface);border-radius:18px;overflow:hidden}
.panel .quotes{padding:10px 10px 0}
.panel .qsub{padding:8px 10px 10px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec + .sec{border-top:1px solid var(--line);padding-top:14px}
.linkbtn{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:6px 0;align-self:center}
.gmo{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border-radius:12px;padding:10px;margin-top:8px}
.gmo label{font-size:13px;font-weight:700;color:var(--muted)}
.gmo input::placeholder{font-family:var(--f-body);font-size:14px;color:var(--muted)}
.metal.single{background:transparent;padding:0}
.metal.single button{flex:0 0 auto;text-align:left;padding:4px 2px;box-shadow:none;background:transparent;font-size:17px}
.gmo input{width:100%;font-family:var(--f-num);font-size:20px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:right}
.gmo-out{display:flex;justify-content:space-between;gap:10px;font-size:14px;flex-wrap:wrap}
.gmo-out b{font-size:18px}
.sec.dim{opacity:.55}
.spike{display:flex;gap:8px;align-items:flex-start;margin:8px 10px 0;padding:8px 10px;border-radius:10px;font-size:13px;line-height:1.5}
.spike b{white-space:nowrap;font-size:14px}
.spike.down{background:var(--sell-soft)} .spike.down b{color:var(--sell)}
.spike.up{background:var(--buy-soft)} .spike.up b{color:var(--buy)}
.gloss{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
.gloss dt{font-weight:700;color:var(--muted)} .gloss dd{margin:0}
.warn-box{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px}
.warn-box b{color:var(--warn)}
/* 注文の内容 */
.ticket{overflow:hidden;background:var(--surface)}
.ticket .head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
.ticket.buy .head{background:var(--buy)} .ticket.sell .head{background:var(--sell)} .ticket.wait .head{background:var(--sunk)}
.ticket .act{font-size:22px;font-weight:800;line-height:1.2;color:#fff}
.ticket.wait .act{color:var(--ink)}
.ticket .act small{display:block;font-size:12px;font-weight:500;opacity:.85;margin-top:2px;white-space:nowrap}
.ticket .body{padding:4px 16px 16px}
.trow{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .k{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap}
.trow .v{font-family:var(--f-num);font-size:24px;font-weight:600;text-align:right;letter-spacing:-.01em;line-height:1.2}
.trow .s{grid-column:2;text-align:right;font-family:var(--f-num);font-size:13px;margin-top:-2px}
.trow .dist{color:var(--ink);font-weight:600;background:var(--sunk);border-radius:6px;padding:1px 6px;margin-right:6px}
.ticket .wait-msg{font-size:15px;color:var(--muted);padding:8px 0 2px}
.ticket .dots i{border-color:rgb(255 255 255 / .7)} .ticket.wait .dots i{border-color:var(--muted)}
.ticket.buy .dots i.on, .ticket.sell .dots i.on{background:#fff}
.ticket.wait .dots i.on{background:var(--ink)}
.ticket .dots span{color:inherit}
.ticket.buy .dots, .ticket.sell .dots{color:#fff}
/* チャート */
.chart-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px}
.chips.tfs{flex-wrap:nowrap;overflow-x:auto;gap:5px;width:100%;scrollbar-width:none}
.chips.tfs::-webkit-scrollbar{display:none}
.chips.tfs .chip{padding:6px 11px;white-space:nowrap;flex:0 0 auto}
.chip{border:0;background:var(--sunk);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-left:auto}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.chart-box{position:relative;width:100%;height:320px}
.chart-box.short{height:220px}
.chart-box canvas{position:absolute;inset:0;width:100%;height:100%}

/* くわしく（開くと中が見える） */
details.more{background:var(--surface);border-radius:16px}
details.more > summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .2s}
details.more[open] > summary::after{transform:rotate(-135deg)}
details.more > .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
details.more summary small{font-weight:500;color:var(--muted);font-size:13px;margin-left:auto}

.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px;align-items:start}
.checks .mk{font-weight:700;text-align:center;border-radius:50%;font-size:12px;line-height:20px;height:20px;width:20px;margin-top:1px}
.checks .ok .mk{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.checks .ng .mk{background:var(--sunk);color:var(--muted)}
.checks .ng{color:var(--muted)}

/* 大きな数字のます目 */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sunk);border-radius:12px;padding:12px;min-width:0}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--f-num);font-size:20px;font-weight:600;overflow-wrap:anywhere}
.big{font-family:var(--f-num);font-size:30px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:6px}
.meter span{display:block;height:100%;background:var(--muted);border-radius:4px}
.meter span.hot{background:var(--sell)}
.limit{display:flex;flex-direction:column;gap:2px}
.limit .top{display:flex;justify-content:space-between;font-size:14px}

/* 取引の一覧 */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0;padding-top:0}
.item .t1{font-size:15px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .t2{font-size:13px;color:var(--muted)}
.item .pnl{font-family:var(--f-num);font-size:17px;font-weight:600;text-align:right}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}
.tag.buy{background:var(--buy-soft);color:var(--buy)} .tag.sell{background:var(--sell-soft);color:var(--sell)}
.empty{color:var(--muted);font-size:15px;text-align:center;padding:8px 0}

.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th,.cmp td{padding:8px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left;white-space:normal}
.cmp thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:500}
.cmp td{font-family:var(--f-num)} .cmp td:first-child{font-family:var(--f-body)}
.scroll-x{overflow-x:auto}

/* 更新・時間を進める帯 */
.clock{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.clock .t{flex:1;min-width:0;color:var(--muted)}
.clock .t b{color:var(--ink)}

/* 設定 */
.group{background:var(--surface);border-radius:16px;overflow:hidden}
.group > h2{padding:14px 14px 4px;font-size:13px;color:var(--muted);font-weight:700}
.field{display:grid;grid-template-columns:1fr 140px;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.group > h2 + .field, .group > h2 + .seg-row{border-top:0}
.field label{font-size:15px}
.field label small{display:block;color:var(--muted);font-size:12px;line-height:1.5;margin-top:2px}
.field input{width:100%;font-family:var(--f-num);font-size:17px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:right}
.group .note, .group .seg-row{padding:12px 16px;border-top:1px solid var(--line)}
.seg2{display:flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg2 button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;font-weight:700;font-size:15px;cursor:pointer;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .14)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--warn-soft);border-radius:12px;padding:12px}
.confirm span{flex:1;min-width:160px;font-size:14px}

/* 目標 */
.goalbar{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.goalbar span{display:block;height:100%;background:var(--gold);border-radius:5px}
.kvs{display:grid;grid-template-columns:minmax(8em,auto) 1fr;gap:6px 12px;font-size:14px}
.kvs .k{color:var(--muted)} .kvs .v{font-family:var(--f-num);text-align:right}
.pace{font-size:14px;font-weight:700;border-radius:10px;padding:8px 10px}
.pace.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pace.ng{background:var(--warn-soft);color:var(--warn)}
.field input[type="date"]{font-size:15px;text-align:left}
/* 下のタブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);max-width:640px;margin:0 auto}
nav.tabs button{border:0;background:transparent;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);cursor:pointer}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"] svg{stroke:var(--gold)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0 / .25)}
footer.disc{font-size:12px;color:var(--muted);line-height:1.7;text-align:center;padding:4px 8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="metal" role="group" aria-label="銘柄">
      <button type="button" data-sym="gold" aria-pressed="true">金</button>
      <button type="button" data-sym="silver" aria-pressed="false">銀</button>
    </div>
    <span class="status" id="mode-badge">サンプル</span>
  </div>
</header>

<main><div class="wrap" id="app"></div></main>

<nav class="tabs" aria-label="画面の切り替え"><div class="in">
  <button type="button" data-tab="signal"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>判断</button>
  <button type="button" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V11"/><path d="M12 20V5"/><path d="M19 20v-6"/></svg>成績</button>
  <button type="button" data-tab="cfg"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</button>
</div></nav>

<script>
"use strict";
/* ============================================================
   金銀シグナル検証 — 仮想取引専用。実際の注文・口座接続は一切しません。
   価格データは「サンプル（架空）」です。データ提供元が決まるまで差し替えません。
   ============================================================ */

/* ---------- 保存（この端末のブラウザ内だけ） ---------- */

/* アプリが決める部分：資金に合わせて、最初に決めた条件（100万円で1回2,500円・1日1万円・5％で停止・同時2つ）と同じ割合にする。
   目標を大きくしても、1回にかける金額は増やさない（検証で、かける額を増やすと資金が大きく減る確率が上がったため） */
function applyAuto(c){
  // 停止ライン：1日の損失上限の2日分。ただし口座の金額の2割まで
  c.riskPerTrade = Math.max(100, Math.min(c.riskPerTrade, c.capital));
  c.dailyLimit = Math.max(c.riskPerTrade, c.dailyLimit);
  const stopAmt = Math.min(c.dailyLimit*2, c.capital*0.2);
  c.maxDDPct = +(stopAmt / c.capital * 100).toFixed(2);
  c.maxPositions = 2; c.rule = "ichimoku"; c.auto.on = true;
  return c;
}
const stopAmount = c => c.capital * c.maxDDPct / 100;
const CFG_VER = 5;
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function mergeCfg(saved, savedVer){
  const c = clone(DEFAULT_CFG);
  if(!saved) return applyAuto(c);
  if(saved.rule==="pullback" || saved.rule==="ichimoku") c.rule = (savedVer>=3 ? saved.rule : "ichimoku");
  if(saved.paramsI) for(const k in c.paramsI) if(typeof saved.paramsI[k]==="number") c.paramsI[k]=saved.paramsI[k];
  if(saved.auto && typeof saved.auto==="object") c.auto = { ...c.auto, ...saved.auto };
  if(saved.fixed && typeof saved.fixed==="object" && savedVer>=5) c.fixed = { ...c.fixed, ...saved.fixed, rr:3 };
  if(saved.goal && typeof saved.goal==="object"){ if(typeof saved.goal.amount==="number") c.goal.amount=saved.goal.amount; if(/^\d{4}-\d{2}-\d{2}$/.test(saved.goal.deadline||"")) c.goal.deadline=saved.goal.deadline; }
  for(const k of (savedVer>=4 ? ["capital","riskPerTrade","dailyLimit","usdjpy"] : ["capital","usdjpy"])) if(typeof saved[k]==="number") c[k]=saved[k];
  // 設定の版が古い（GMOの実際の値を入れる前）なら、金のコストは新しい初期値を使う
  for(const s of ["gold","silver"]) if(saved.cost && saved.cost[s] && !(s==="gold" && !(savedVer>=2))) for(const k in c.cost[s]) if(typeof saved.cost[s][k]==="number") c.cost[s][k]=saved.cost[s][k];
  if(saved.params) for(const k in c.params) if(typeof saved.params[k]==="number") c.params[k]=saved.params[k];
  return applyAuto(c);
}

/* ---------- サンプル価格の生成（毎回同じ値動きになる架空データ） ---------- */
const HIST = 9000, FUT = 1500;   // サンプルの1時間足の本数
let TOTAL = HIST + FUT;

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function genData(){
  const rnd = mulberry32(20261104);
  const gauss = () => { let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const mk = () => ({ t:new Float64Array(TOTAL), o:new Float64Array(TOTAL), h:new Float64Array(TOTAL), l:new Float64Array(TOTAL), c:new Float64Array(TOTAL) });
  const G = mk(), Sv = mk();
  let t = Date.UTC(2025,5,16,0,0,0);
  let lg = Math.log(3900), ls = Math.log(46), vol = 1, drift = 0, left = 0;
  for(let i=0;i<TOTAL;i++){
    while(true){ const wd = new Date(t).getUTCDay(); if(wd===0||wd===6) t += 3600e3; else break; }
    if(left-- <= 0){ drift = (rnd()-0.5)*0.00035; left = 80 + Math.floor(rnd()*420); }
    vol = 0.97*vol + 0.03*(0.55 + 0.9*rnd());
    if(rnd() < 0.004) vol *= 2.2;
    vol = Math.min(vol, 3.2);
    const og = Math.exp(lg), os = Math.exp(ls);
    let hg=og, lgw=og, hs=os, lsw=os;
    for(let k=0;k<4;k++){
      const zg = gauss(), zs = 0.75*zg + 0.66*gauss();
      lg += drift/4 + 0.0012*vol*zg;
      ls += drift*1.25/4 + 0.0021*vol*zs;
      const pg=Math.exp(lg), ps=Math.exp(ls);
      hg=Math.max(hg,pg); lgw=Math.min(lgw,pg); hs=Math.max(hs,ps); lsw=Math.min(lsw,ps);
    }
    G.t[i]=Sv.t[i]=t;
    G.o[i]=og; G.h[i]=hg; G.l[i]=lgw; G.c[i]=Math.exp(lg);
    Sv.o[i]=os; Sv.h[i]=hs; Sv.l[i]=lsw; Sv.c[i]=Math.exp(ls);
    t += 3600e3;
  }
  return { gold:G, silver:Sv, fx:null };
}

async function fetchSeries(symbol){
  let r;
  try{ r = await fetch("api/series?symbol="+encodeURIComponent(symbol), { cache:"no-store" }); }
  catch(e){ throw { kind:"network" }; }
  let j = null; try{ j = await r.json(); }catch(e){}
  if(!r.ok || !j || !Array.isArray(j.values)) throw { kind:(j && j.error) || "bad_response", code:j && j.code, detail:j && j.message, keyLength:j && j.keyLength, keyId:j && j.keyId, symbol };
  return j.values;   // [時刻(ms), 始値, 高値, 安値, 終値] の配列
}
function buildLive(g, s, f){
  const now = Date.now();
  const split = v => {
    v = [...v].sort((a,b)=>a[0]-b[0]);
    if(!v.length) throw { kind:"empty" };
    const last = v[v.length-1];
    const done = last[0] + 3600e3 <= now ? v : v.slice(0,-1);   // 判断は確定した足だけで行う
    return { done, live:{ price:last[4], t:last[0] } };
  };
  const G = split(g), Sv = s ? split(s) : null, F = split(f);
  const sMap = Sv ? new Map(Sv.done.map(x=>[x[0],x])) : null;
  const both = sMap ? G.done.filter(x=>sMap.has(x[0])) : G.done;   // 銀もあるときは、金と銀の両方がある時間だけ使う
  if(both.length < WARMUP + 100) throw { kind:"short" };
  const n = both.length;
  const mk = () => ({ t:new Float64Array(n), o:new Float64Array(n), h:new Float64Array(n), l:new Float64Array(n), c:new Float64Array(n) });
  const gold = mk(), silver = Sv ? mk() : null, fx = new Float64Array(n);
  let k = 0, lastFx = F.done.length ? F.done[0][4] : F.live.price;
  for(let i=0;i<n;i++){
    const a = both[i];
    gold.t[i]=a[0]; gold.o[i]=a[1]; gold.h[i]=a[2]; gold.l[i]=a[3]; gold.c[i]=a[4];
    if(silver){ const b = sMap.get(a[0]); silver.t[i]=a[0]; silver.o[i]=b[1]; silver.h[i]=b[2]; silver.l[i]=b[3]; silver.c[i]=b[4]; }
    while(k < F.done.length && F.done[k][0] <= a[0]){ lastFx = F.done[k][4]; k++; }
    fx[i] = lastFx;
  }
  return { data:{ gold, silver, fx }, live:{ gold:G.live, silver:Sv ? Sv.live : null, fx:F.live } };
}

/* ---------- 指標（平均線・RSI・値動きの大きさ） ---------- */
function ema(a,n){ const k=2/(n+1), o=new Float64Array(a.length); o[0]=a[0]; for(let i=1;i<a.length;i++) o[i]=a[i]*k+o[i-1]*(1-k); return o; }
function rsi(c,n){ const o=new Float64Array(c.length).fill(50); let g=0,l=0;
  for(let i=1;i<c.length;i++){ const d=c[i]-c[i-1], up=Math.max(d,0), dn=Math.max(-d,0);
    if(i<=n){ g+=up/n; l+=dn/n; } else { g=(g*(n-1)+up)/n; l=(l*(n-1)+dn)/n; }
    if(i>=n) o[i] = l===0 ? 100 : 100-100/(1+g/l); }
  return o; }
function atr(D,n){ const o=new Float64Array(D.c.length); let a=D.h[0]-D.l[0]; o[0]=a;
  for(let i=1;i<D.c.length;i++){ const tr=Math.max(D.h[i]-D.l[i], Math.abs(D.h[i]-D.c[i-1]), Math.abs(D.l[i]-D.c[i-1])); a = i<n ? (a*i+tr)/(i+1) : (a*(n-1)+tr)/n; o[i]=a; }
  return o; }
function sma(a,n){ const o=new Float64Array(a.length); let s=0; for(let i=0;i<a.length;i++){ s+=a[i]; if(i>=n) s-=a[i-n]; o[i]=s/Math.min(i+1,n); } return o; }
const CACHE = {};
function emaOf(sym,n){ const k=sym+":e"+n; return CACHE[k] || (CACHE[k]=ema(DATA[sym].c,n)); }
function fxAt(i){ return MODE==="live" ? DATA.fx[i] : S.cfg.usdjpy; }          // その時点のドル円
function fxNow(){ return MODE==="live" ? LIVE.fx.price : S.cfg.usdjpy; }
function midNow(sym){ return MODE==="live" ? LIVE[sym].price : DATA[sym].c[S.nowIdx]; }  // 今の価格（売値と買値の中間）
function tNow(){ return MODE==="live" ? Date.now() : DATA.gold.t[S.nowIdx]; }
function base(sym){ const k=sym+":b"; if(!CACHE[k]){ const a=atr(DATA[sym],14); CACHE[k]={ rsi:rsi(DATA[sym].c,14), atr:a, atrAvg:sma(a,100) }; } return CACHE[k]; }

function rollMax(a,n){ const o=new Float64Array(a.length); for(let i=0;i<a.length;i++){ let m=-Infinity; for(let k=Math.max(0,i-n+1);k<=i;k++) if(a[k]>m) m=a[k]; o[i]=m; } return o; }
function rollMin(a,n){ const o=new Float64Array(a.length); for(let i=0;i<a.length;i++){ let m=Infinity; for(let k=Math.max(0,i-n+1);k<=i;k++) if(a[k]<m) m=a[k]; o[i]=m; } return o; }
/* 一目均衡表（9・26・52。雲は26本前に計算した値）と、日足の流れ（約20日の平均線） */
function ichi(sym){
  const k=sym+":i"; if(CACHE[k]) return CACHE[k];
  const D=DATA[sym], n=D.c.length, h9=rollMax(D.h,9), l9=rollMin(D.l,9), h26=rollMax(D.h,26), l26=rollMin(D.l,26), h52=rollMax(D.h,52), l52=rollMin(D.l,52);
  const ten=new Float64Array(n), kij=new Float64Array(n), top=new Float64Array(n), bot=new Float64Array(n);
  for(let i=0;i<n;i++){
    ten[i]=(h9[i]+l9[i])/2; kij[i]=(h26[i]+l26[i])/2;
    const j=i-26; if(j>=0){ const a=((h9[j]+l9[j])/2+(h26[j]+l26[j])/2)/2, b=(h52[j]+l52[j])/2; top[i]=Math.max(a,b); bot[i]=Math.min(a,b); } else { top[i]=bot[i]=D.c[i]; }
  }
  return CACHE[k] = { ten, kij, top, bot, daily: emaOf(sym,460) };
}
const RULES = {
  ichimoku: { name:"一目均衡表＋損切り幅の下限＋日足の流れ", pk:"paramsI", grid:{ slMult:[1,1.5,2,2.5], rr:[1.5,2,3], minStop:[0,6,10,15] } },
  pullback: { name:"押し目・戻り（最初のルール）", pk:"params", grid:{ fast:[10,20,30], slow:[50,100,150], slMult:[1,1.5,2], rr:[1.5,2,2.5] } },
};
function curParams(cfg){ return cfg[RULES[cfg.rule].pk]; }
function signalAt(sym, i, p, cfg, explain){ return cfg.rule==="ichimoku" ? signalIchimoku(sym,i,p,cfg,explain) : signalPullback(sym,i,p,cfg,explain); }
/* 一目均衡表のルール（検証した中から選んだもの）
   買い：価格が雲を上に抜けた ＋ 転換線が基準線より上 ＋ 日足の流れが上向き ＋ 損切り幅が下限以上 ＋ コストが小さい。売りはその逆 */
function signalIchimoku(sym, i, p, cfg, explain){
  const D=DATA[sym], B=base(sym), I=ichi(sym);
  if(i < WARMUP) return { side:"wait", stopDist:0, buy:[], sell:[] };
  const c=D.c[i], a=B.atr[i], stopDist=p.slMult*a, spread=cfg.cost[sym].spread, costRatio=spread/stopDist;
  // 抜けた足が大きいこと（ふだんの値動きの0.6倍以上）も条件に（第9回の検証で、どのコストでも良くなった）
  const big = Math.abs(c - D.o[i]) > 0.6*a;
  const bCloud = c>I.top[i] && D.c[i-1]<=I.top[i-1] && big, sCloud = c<I.bot[i] && D.c[i-1]>=I.bot[i-1] && big;
  const bTk = I.ten[i]>I.kij[i], sTk = I.ten[i]<I.kij[i];
  const dUp = I.daily[i]>I.daily[i-115], dDn = I.daily[i]<I.daily[i-115];
  const wide = stopDist>=p.minStop, cheap = costRatio<=0.10;
  const bOk=bCloud&&bTk&&dUp&&wide&&cheap, sOk=sCloud&&sTk&&dDn&&wide&&cheap;
  const side = bOk ? "buy" : sOk ? "sell" : "wait";
  if(!explain) return { side, stopDist };
  const ws=`損切りまでの幅が十分ある（今は${stopDist.toFixed(0)}ドル）`, cs=`取引のコストが小さい（損切りまでの幅の${(costRatio*100).toFixed(0)}％）`;
  return { side, stopDist,
    buy:[ { ok:bCloud, short:"もみ合い抜け", text:"値段が、最近のもみ合いの範囲を、大きな動きで上に抜けた（直近1時間）" }, { ok:bTk, short:"勢い", text:"ここ数日の勢いが上向き" }, { ok:dUp, short:"大きな流れ", text:"この1か月の大きな流れが上向き" }, { ok:wide, short:"損切り幅", text:ws }, { ok:cheap, short:"コスト", text:cs } ],
    sell:[ { ok:sCloud, short:"もみ合い抜け", text:"値段が、最近のもみ合いの範囲を、大きな動きで下に抜けた（直近1時間）" }, { ok:sTk, short:"勢い", text:"ここ数日の勢いが下向き" }, { ok:dDn, short:"大きな流れ", text:"この1か月の大きな流れが下向き" }, { ok:wide, short:"損切り幅", text:ws }, { ok:cheap, short:"コスト", text:cs } ] };
}
/* ---------- 売買判断のルール ----------
   買い：大きな流れが上向き ＋ 一時的な下げから短期平均線を上に抜け直した ＋ 勢いが行き過ぎていない
         ＋ 値動きが荒れすぎていない ＋ コストが損切り幅に比べて小さい。売りはその逆。 */
const WARMUP = 220;
function signalPullback(sym, i, p, cfg, explain){
  const D=DATA[sym], ef=emaOf(sym,p.fast), es=emaOf(sym,p.slow), B=base(sym);
  if(i < WARMUP) return { side:"wait", stopDist:0, buy:[], sell:[] };
  const c=D.c[i], a=B.atr[i], r=B.rsi[i], vr=a/B.atrAvg[i];
  const stopDist = p.slMult*a, spread = cfg.cost[sym].spread, costRatio = spread/stopDist;
  const bTrend = es[i]>es[i-24] && c>es[i], sTrend = es[i]<es[i-24] && c<es[i];
  const bCross = D.c[i-1]<=ef[i-1] && c>ef[i], sCross = D.c[i-1]>=ef[i-1] && c<ef[i];
  const bRsi = r>=40 && r<=70, sRsi = r>=30 && r<=60;
  const calm = vr < 1.8, cheap = costRatio <= 0.10;
  const bOk = bTrend&&bCross&&bRsi&&calm&&cheap, sOk = sTrend&&sCross&&sRsi&&calm&&cheap;
  const side = bOk ? "buy" : sOk ? "sell" : "wait";
  if(!explain) return { side, stopDist };
  const rs = r.toFixed(0), vs = vr.toFixed(1), cs = (costRatio*100).toFixed(0);
  return { side, stopDist, rsi:r, volRatio:vr,
    buy:[
      { ok:bTrend, text:"大きな流れが上向き（長期の平均線が上向きで、価格がその上にある）" },
      { ok:bCross, text:"一時的に下がったあと、短期の平均線を上に抜け直した（直近1時間）" },
      { ok:bRsi,   text:`上がり過ぎていない（RSI ${rs}。40〜70なら可）` },
      { ok:calm,   text:`値動きが荒れすぎていない（ふだんの${vs}倍。1.8倍未満なら可）` },
      { ok:cheap,  text:`取引コストが損切り幅の10％以内（今は${cs}％）` }

/* 候補価格：買いは売値＋スプレッドで入り、売値で決済する想定（コスト込み） */
function levels(side, mid, stopDist, p, spread){
  const dir = side==="buy" ? 1 : -1, entry = mid + dir*spread/2;
  return { dir, entry, sl: entry - dir*stopDist, tp: entry + dir*stopDist*p.rr };
}
function sizeFor(sym, stopDist, cfg, rate){
  const c = cfg.cost[sym], perUnit = (stopDist + c.slip) * rate;
  const q = Math.floor(cfg.riskPerTrade / perUnit / c.step + 1e-9) * c.step;
  const qty = Math.max(0, +q.toFixed(4));
  return { qty, risk: qty*perUnit, perUnit };

/* ---------- 口座とリスク管理（仮想取引・過去検証の共通ルール） ---------- */
function dayKey(t){ return new Date(t + 9*3600e3).toISOString().slice(0,10); } // 日本時間の日付
function newAcct(cfg){ return { balance:cfg.capital, peak:cfg.capital, trades:[], positions:[], halted:null, dayKey:"", dayPnl:0, nextId:1 }; }
function riskBlocks(acct, cfg, sym, newRisk, t){
  const out = [];
  if(sym==="gold" && !gmoOpen(t)) out.push(`GMOクリック証券の取引時間外（日本時間 ${usDst(t)?"7:00〜翌6:00":"8:00〜翌7:00"}、土日は休み）`);
  if(acct.halted) out.push(`最大ドローダウン（${cfg.maxDDPct}％）に達したため、新しい取引を停止中`);
  if(acct.positions.length >= cfg.maxPositions) out.push(`同時に持てるポジションの上限（${cfg.maxPositions}つ）に達している`);
  if(acct.positions.some(x=>x.sym===sym)) out.push("この銘柄はすでに保有中（同じ銘柄は1つまで）");
  const dp = acct.dayKey===dayKey(t) ? acct.dayPnl : 0;
  const openRisk = acct.positions.reduce((s,x)=>s+x.risk,0);
  if(dp <= -cfg.dailyLimit) out.push(`本日の損失が上限（${yen(cfg.dailyLimit)}）に達した`);
  else if(dp - openRisk - newRisk < -cfg.dailyLimit) out.push(`損切りになった場合、本日の損失上限（${yen(cfg.dailyLimit)}）を超えるおそれがある`);
  return out;
}
function openPos(acct, sym, lv, sz, t){
  const pos = { id:acct.nextId++, sym, dir:lv.dir, entry:lv.entry, sl:lv.sl, tp:lv.tp, qty:sz.qty, risk:sz.risk, t };
  acct.positions.push(pos); return pos;
}
/* 1本の足の中で損切り・利確に届いたか。両方届いた足は不利な方（損切り）とみなす */
function checkExit(pos, D, j, c){
  const h=c.spread/2;
  if(pos.dir===1){
    const o=D.o[j]-h, lo=D.l[j]-h, hi=D.h[j]-h;
    if(o<=pos.sl) return { price:o-c.slip, why:"損切り" };
    if(lo<=pos.sl) return { price:pos.sl-c.slip, why:"損切り" };
    if(o>=pos.tp) return { price:o, why:"利確" };
    if(hi>=pos.tp) return { price:pos.tp, why:"利確" };
  } else {
    const o=D.o[j]+h, lo=D.l[j]+h, hi=D.h[j]+h;
    if(o>=pos.sl) return { price:o+c.slip, why:"損切り" };
    if(hi>=pos.sl) return { price:pos.sl+c.slip, why:"損切り" };
    if(o<=pos.tp) return { price:o, why:"利確" };
    if(lo<=pos.tp) return { price:pos.tp, why:"利確" };
  }
  return null;
}
/* 持ち越した日数：日本時間の朝7時（夏時間は6時）をまたいだ回数。週末をまたぐと土日の分も数える */
function rollovers(t0, t1){ const day=86400e3, off=22*3600e3; return Math.max(0, Math.floor((t1-off)/day) - Math.floor((t0-off)/day)); }
/* GMOクリック証券の金スポットの取引時間：日本時間 月曜8:00〜土曜7:00、毎日7:00〜8:00は休み（米国の夏時間は1時間早まる） */
function usDst(t){
  const y=new Date(t).getUTCFullYear();
  const nthSun=(m,n)=>{ const f=new Date(Date.UTC(y,m,1)).getUTCDay(); return Date.UTC(y,m,1+((7-f)%7)+7*(n-1)); };
  return t >= nthSun(2,2)+7*3600e3 && t < nthSun(10,1)+6*3600e3;
}
function mondayFirstHour(t){ const j=new Date(t + 9*3600e3 + (usDst(t)?3600e3:0)); return j.getUTCDay()===1 && j.getUTCHours()===8; }   // 週明けの最初の1時間（窓が開きやすい）
function gmoOpen(t){
  const j=new Date(t + 9*3600e3 + (usDst(t)?3600e3:0));   // 夏時間でも「8時開始」として扱えるようにずらす
  const wd=j.getUTCDay(), h=j.getUTCHours();
  if(h===7 || wd===0) return false;
  if(wd===6) return h<7;
  if(wd===1) return h>=8;
  return true;
}
function closePos(acct, cfg, pos, price, t, why, rate){
  const c = cfg.cost[pos.sym];
  const days = rollovers(pos.t, t);
  const swap = (pos.dir===1 ? c.swapLong : c.swapShort) * pos.qty * days;
  const gross = (price - pos.entry) * pos.dir * pos.qty * rate;
  const net = gross - swap;
  const cost = (c.spread + (why==="損切り" ? c.slip : 0)) * pos.qty * rate + swap;
  acct.positions = acct.positions.filter(x=>x!==pos);
  const tr = { id:pos.id, sym:pos.sym, dir:pos.dir, qty:pos.qty, entry:pos.entry, exit:price, sl:pos.sl, tp:pos.tp, t:pos.t, exitT:t, why, net, cost };
  acct.trades.push(tr);
  acct.balance += net;
  const dk = dayKey(t);
  if(acct.dayKey !== dk){ acct.dayKey = dk; acct.dayPnl = 0; }
  acct.dayPnl += net;
  acct.peak = Math.max(acct.peak, acct.balance);
  if(!acct.halted && (acct.peak - acct.balance)/acct.peak*100 >= cfg.maxDDPct)
    acct.halted = { t, text:`資金が最高値から${cfg.maxDDPct}％以上減ったため停止しました` };
  return tr;
}

/* ---------- 成績の集計 ---------- */
function stats(trades, capital){
  let eq=capital, peak=capital, mdd=0, gp=0, gl=0, wins=0, cost=0;
  for(const tr of trades){ eq+=tr.net; peak=Math.max(peak,eq); mdd=Math.max(mdd,peak-eq); if(tr.net>0){wins++;gp+=tr.net;} else gl-=tr.net; cost+=tr.cost; }
  const n=trades.length;
  return { n, wins, winRate:n?wins/n:0, gp, gl, pf: gl>0 ? gp/gl : (gp>0?Infinity:0), net:eq-capital, mdd, mddPct: mdd/ (capital+Math.max(0,peak-capital)) * 100, cost, avgWin: wins?gp/wins:0, avgLoss: (n-wins)?gl/(n-wins):0, avg: n?(eq-capital)/n:0 };
}

/* ---------- 過去検証 ---------- */
function backtest(p, cfg, from, to){
  const acct = newAcct(cfg), pending = {};
  for(let i=from;i<to;i++){
    for(const sym of activeSyms()){
      const D=DATA[sym], c=cfg.cost[sym];
      if(pending[sym]){
        const pd=pending[sym]; pending[sym]=null;
        const lv=levels(pd.side, D.o[i], pd.stopDist, p, c.spread), sz=sizeFor(sym,pd.stopDist,cfg,fxAt(i));
        if(sz.qty>0 && riskBlocks(acct,cfg,sym,sz.risk,D.t[i]).length===0) openPos(acct,sym,lv,sz,D.t[i]);
      }
      const pos = acct.positions.find(x=>x.sym===sym);
      if(pos){ const ex=checkExit(pos,D,i,c); if(ex) closePos(acct,cfg,pos,ex.price,D.t[i],ex.why,fxAt(i)); }
      if(i<to-1 && !acct.halted && !acct.positions.some(x=>x.sym===sym)){
        const s=signalAt(sym,i,p,cfg,false);
        if(s.side!=="wait") pending[sym]={ side:s.side, stopDist:s.stopDist };
      }
    }
  }
  for(const pos of [...acct.positions]){ const D=DATA[pos.sym], h=cfg.cost[pos.sym].spread/2; closePos(acct,cfg,pos,D.c[to-1]-pos.dir*h,D.t[to-1],"期間終了",fxAt(to-1)); }
  return { acct, st:stats(acct.trades,cfg.capital), from, to };
}
let GRID = RULES.pullback.grid;
function gridCombos(grid){
  let out=[{ p:{}, idx:[] }];
  for(const k of Object.keys(grid)) out=out.flatMap(x=>grid[k].map((v,j)=>({ p:{ ...x.p, [k]:v }, idx:[...x.idx, j] })));
  return out.filter(x=>!(x.p.fast!=null && x.p.fast>=x.p.slow));
}
/* 設定の組み合わせを試し、「少しずらしても崩れにくい」ものに点数をつける */
function scoreCombos(cfg, from, to, minN){
  const res = gridCombos(RULES[cfg.rule].grid).map(x=>({ ...x, st:backtest(x.p, cfg, from, to).st }));
  const find = idx => res.find(r=>r.idx.every((v,k)=>v===idx[k]));
  for(const r of res){
    const ns=[r];
    for(let k=0;k<r.idx.length;k++) for(const dlt of [-1,1]){ const idx=[...r.idx]; idx[k]+=dlt; const n=find(idx); if(n) ns.push(n); }
    r.score = r.st.n>=minN ? ns.reduce((s,x)=>s+x.st.net,0)/ns.length : -Infinity;
  }
  return res;
}
/* 毎月の自動見直し：直近3か月の値動きで設定を選び直す（その時点より前のデータだけを使う） */
function autoTune(force){
  const cfg=S.cfg, month=new Date(Date.now()+9*3600e3).toISOString().slice(0,7);
  if(MODE!=="live" || !cfg.auto.on || (!force && cfg.auto.month===month && cfg.auto.rule===cfg.rule)) return false;
  // 1週間ずつずらした4回分（それぞれ直近3か月）の点の平均で選ぶ（見直しの日による当たり外れを減らす。検証でばらつきが半分に）
  const T=DATA.gold.t, end=TOTAL, idxAt=ms=>{ const k=T.findIndex(t=>t>=ms); return k<0?end:k; };
  const sum=new Map(), cnt=new Map(); let res=null;
  for(let k=0;k<4;k++){
    const e=idxAt(T[end-1]-k*7*86400e3+1), f=Math.max(WARMUP, idxAt(T[end-1]-k*7*86400e3-91*86400e3));
    if(e-f<200) continue;
    const r=scoreCombos(cfg, f, e, 5); if(k===0) res=r;
    for(const x of r){ const key=x.idx.join(","); if(!isFinite(x.score)) continue; sum.set(key,(sum.get(key)||0)+x.score); cnt.set(key,(cnt.get(key)||0)+1); }
  }
  if(!res) return false;
  const looks=Math.max(...cnt.values(), 0);
  let best=null; for(const x of res){ const key=x.idx.join(","); if(cnt.get(key)!==looks) continue; x.score=sum.get(key)/looks; if(!best || x.score>best.score) best=x; }
  if(!best || !isFinite(best.score)) return false;
  cfg[RULES[cfg.rule].pk] = clone(best.p);
  cfg.auto = { ...cfg.auto, month, rule:cfg.rule, at:Date.now(), trades:best.st.n, net:best.st.net, from:T[Math.max(WARMUP, idxAt(T[end-1]-91*86400e3))], to:T[end-1] };
  return true;
}
function runValidation(cfg){
  const end = S.nowIdx+1, split = WARMUP + Math.floor((end-WARMUP)*0.7);
  GRID = RULES[cfg.rule].grid;
  const res = scoreCombos(cfg, WARMUP, split, 20);
  const robust = res.reduce((a,b)=> b.score>a.score ? b : a);
  const best = res.filter(r=>r.st.n>=20).reduce((a,b)=> b.st.net>a.st.net ? b : a, robust);
  const robustTune = backtest(robust.p, cfg, WARMUP, split), robustConf = backtest(robust.p, cfg, split, end);
  const bestConf = backtest(best.p, cfg, split, end);
  const curTune = backtest(curParams(cfg), cfg, WARMUP, split), curConf = backtest(curParams(cfg), cfg, split, end);
  return { at:Date.now(), nowIdx:S.nowIdx, split, end, combos:res.length, cond:clone({ capital:cfg.capital, riskPerTrade:cfg.riskPerTrade, dailyLimit:cfg.dailyLimit, maxDDPct:cfg.maxDDPct, maxPositions:cfg.maxPositions, cost:cfg.cost.gold }), startT:DATA.gold.t[WARMUP], splitT:DATA.gold.t[split], endT:DATA.gold.t[end-1],

  let src;
  if(tf==="4h") src = aggregate(sl(D.t),sl(D.o),sl(D.h),sl(D.l),sl(D.c), t=>Math.floor(t/(4*3600e3)));
  else if(tf==="3m"){
    if(MODE!=="live") return "none";
    const m=TFC["1min"]; if(!m || (Date.now()-m.at>180e3 && !m.busy)) loadTF("1min");
    if(!m || !m.t) return m&&m.err ? "none" : "wait";
    src = aggregate(m.t,m.o,m.h,m.l,m.c, t=>Math.floor(t/180e3));
  } else {
    let d;
    if(MODE==="live"){ const m=TFC["1day"]; if(!m || (Date.now()-m.at>6*3600e3 && !m.busy)) loadTF("1day"); if(!m || !m.t) return m&&m.err ? "none" : "wait"; d=m; }
    else d = aggregate(sl(D.t),sl(D.o),sl(D.h),sl(D.l),sl(D.c), t=>Math.floor((t+9*3600e3)/86400e3));
    src = tf==="1d" ? { t:[...d.t], o:[...d.o], h:[...d.h], l:[...d.l], c:[...d.c] } : aggregate(d.t,d.o,d.h,d.l,d.c, tf==="1w"?weekKey:monthKey);
  }
  // 最後の足に今の価格を反映
  const L=src.c.length-1, px=midNow("gold");
  if(L>=0 && MODE==="live"){ src.c[L]=px; src.h[L]=Math.max(src.h[L],px); src.l[L]=Math.min(src.l[L],px); }
  src.tf=tf; return src;
}

/* ---------- 描画：ローソク足チャート ---------- */
function setupCanvas(cv){
  const r = cv.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
  cv.width = Math.max(1,Math.round(r.width*dpr)); cv.height = Math.max(1,Math.round(r.height*dpr));
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); return { g, w:r.width, h:r.height };
}
function drawCandles(cv, sym, endIdx, n, lines, src){
  const { g, w, h } = setupCanvas(cv), D=src||DATA[sym], p=S.cfg.params, ind=!src;
  const isI = ind && S.cfg.rule==="ichimoku", I = isI ? ichi(sym) : null;
  const ef = !ind ? null : isI ? I.ten : emaOf(sym,p.fast), es = !ind ? null : isI ? I.top : emaOf(sym,p.slow), eb = isI ? I.bot : null;
  const s = Math.max(0,endIdx-n+1), padR=74, padB=22, padT=10, cw=w-padR, ch=h-padB-padT;
  // 縦の範囲はろうそくと横線で決める（雲で縮まないように）
  let lo=Infinity, hi=-Infinity;
  for(let i=s;i<=endIdx;i++){ lo=Math.min(lo,D.l[i]); hi=Math.max(hi,D.h[i]); }
  for(const L of lines) if(!L.ref){ lo=Math.min(lo,L.v); hi=Math.max(hi,L.v); }
  const pad=(hi-lo)*0.08||1; lo-=pad; hi+=pad;
  const y = v => padT + (hi-v)/(hi-lo)*ch, step = cw/n, x = i => (i-s+0.5)*step;
  const ink=css("--ink"), muted=css("--muted"), line=css("--line"), up=css("--buy"), dn=css("--sell"), gold=css("--gold"), surf=css("--surface"), num=css("--f-num");
  g.clearRect(0,0,w,h);
  // 横の目盛り（4本・うすく）
  g.font="11px "+num; g.textBaseline="middle"; g.textAlign="left";
  const tick = (()=>{ const raw=(hi-lo)/4, mag=Math.pow(10,Math.floor(Math.log10(raw))); return [1,2,2.5,5,10].map(k=>k*mag).find(k=>k>=raw); })();
  for(let v=Math.ceil(lo/tick)*tick; v<hi; v+=tick){ const yy=y(v); g.strokeStyle=line; g.lineWidth=1; g.beginPath(); g.moveTo(0,Math.round(yy)+.5); g.lineTo(cw,Math.round(yy)+.5); g.stroke(); g.fillStyle=muted; g.fillText(Math.round(v).toLocaleString("en-US"),cw+8,yy); }
  // 日付・時刻（下）
  g.textAlign="center"; g.textBaseline="alphabetic"; g.fillStyle=muted;
  if(src){
    // 別の足の長さ：4つほど等しい間かくで日付・時刻を出す
    const every=Math.max(1,Math.ceil(n/4));
    for(let i=endIdx-Math.floor(every/2);i>=s;i-=every){
      const j=new Date(D.t[i]+9*3600e3), M=j.getUTCMonth()+1, d=j.getUTCDate(), hh=j.getUTCHours(), mm=String(j.getUTCMinutes()).padStart(2,"0");
      const lab = src.tf==="3m" ? `${hh}:${mm}` : src.tf==="4h" ? `${M}/${d}` : src.tf==="1M" ? `${j.getUTCFullYear()}/${M}` : src.tf==="1w" ? `${String(j.getUTCFullYear()).slice(2)}/${M}/${d}` : `${M}/${d}`;
      if(x(i)>16 && x(i)<cw-16) g.fillText(lab, x(i), h-6);
    }
  } else for(let i=s;i<=endIdx;i++){
    const j=new Date(D.t[i]+9*3600e3), hr=j.getUTCHours();
    const mark = n<=24 ? (hr%6===0) : (hr===0 || (i>s && new Date(D.t[i-1]+9*3600e3).getUTCDate()!==j.getUTCDate() && hr<3));
    if(mark && x(i)>16 && x(i)<cw-16){ g.fillText(n<=24 ? hr+"時" : (j.getUTCMonth()+1)+"/"+j.getUTCDate(), x(i), h-6); }
  }
  g.save(); g.beginPath(); g.rect(0,padT,cw,ch); g.clip();
  if(MODE==="sample"){ g.save(); g.fillStyle=muted; g.globalAlpha=.10; g.font="700 "+Math.min(22,w/14)+"px "+css("--f-body"); g.textAlign="center"; g.textBaseline="middle"; g.fillText("サンプル", cw/2, padT+ch/2); g.restore(); }
  // 雲（うすい帯）と転換線
  if(isI && ind){
    g.save(); g.globalAlpha=.13; g.fillStyle=css("--silver"); g.beginPath();
    for(let i=s;i<=endIdx;i++){ const yy=y(es[i]); i===s?g.moveTo(x(i),yy):g.lineTo(x(i),yy); }
    for(let i=endIdx;i>=s;i--) g.lineTo(x(i),y(eb[i]));
    g.closePath(); g.fill(); g.restore();
  }
  // ろうそく（上昇＝赤、下落＝青）
  const bw = Math.max(1.5, Math.min(8, step*0.62));
  for(let i=s;i<=endIdx;i++){
    const o=D.o[i], c=D.c[i], col = c>=o ? up : dn, xx=Math.round(x(i))+.5;
    g.strokeStyle=col; g.fillStyle=col; g.lineWidth=1;
    g.beginPath(); g.moveTo(xx,y(D.h[i])); g.lineTo(xx,y(D.l[i])); g.stroke();
    g.fillRect(xx-bw/2, y(Math.max(o,c)), bw, Math.max(1,Math.abs(y(o)-y(c))));
  }
  const plot = (arr,col,wd,al=1) => { g.save(); g.globalAlpha=al; g.strokeStyle=col; g.lineWidth=wd; g.beginPath(); for(let i=s;i<=endIdx;i++){ const yy=y(arr[i]); i===s?g.moveTo(x(i),yy):g.lineTo(x(i),yy); } g.stroke(); g.restore(); };
  if(ind){ if(isI) plot(ef, gold, 1.5, .9); else { plot(ef, gold, 1.5, .9); plot(es, muted, 1.2, .8); } }
  // 横線（入る＝白、利確＝赤、損切り＝青）
  for(const L of lines){
    const yy=y(L.v), col = L.kind==="tp"?up : L.kind==="sl"?dn : ink;
    g.save(); g.globalAlpha = L.ref ? .3 : .85; g.strokeStyle=col; g.lineWidth=1; g.setLineDash(L.kind==="entry"?[]:[4,4]);
    g.beginPath(); g.moveTo(0,Math.round(yy)+.5); g.lineTo(cw,Math.round(yy)+.5); g.stroke(); g.restore();
  }
  g.restore();
  // 右側の値札（重ならないようにずらす）。今の価格は白抜き
  const last=D.c[endIdx];
  const tags=[{ v:last, bg:surf, fg:ink, border:ink, label:"今" }, ...lines.filter(L=>!L.ref).map(L=>({ v:L.v, bg:L.kind==="tp"?up:L.kind==="sl"?dn:ink, fg:L.kind==="entry"?surf:"#fff", label:L.kind==="tp"?"利":L.kind==="sl"?"損":"入" }))];
  tags.forEach(t=>t.y=y(t.v)); tags.sort((a,b)=>a.y-b.y);
  for(let k=1;k<tags.length;k++) if(tags[k].y-tags[k-1].y<18) tags[k].y=tags[k-1].y+18;
  for(const t of tags){
    const yy=Math.min(Math.max(t.y,padT+8),h-padB+4);
    g.fillStyle=t.bg; g.beginPath(); g.roundRect ? g.roundRect(cw+2,yy-9,padR-4,18,4) : g.rect(cw+2,yy-9,padR-4,18); g.fill();
    if(t.border){ g.strokeStyle=t.border; g.lineWidth=1; g.stroke(); }
    g.fillStyle=t.fg; g.font="600 11px "+num; g.textAlign="left"; g.textBaseline="middle";
    g.fillText(t.label+" "+Math.round(t.v).toLocaleString("en-US"), cw+6, yy);
  }
}

function drawEquity(cv, series, opts={}){
  const { g, w, h } = setupCanvas(cv);
  const padR=70, padB=20, padT=10, cw=w-padR, ch=h-padB-padT;
  const all = series.flatMap(s=>s.pts);

  let lo=Infinity, hi=-Infinity, t0=Infinity, t1=-Infinity;
  for(const p of all){ lo=Math.min(lo,p.v); hi=Math.max(hi,p.v); t0=Math.min(t0,p.t); t1=Math.max(t1,p.t); }
  if(opts.floor!=null){ lo=Math.min(lo,opts.floor); }

  g.textAlign="left"; g.textBaseline="alphabetic"; g.fillStyle=muted; g.fillText(fd(t0),0,h-5); g.textAlign="right"; g.fillText(fd(t1),cw,h-5);
  if(opts.floor!=null){ const yy=y(opts.floor); g.strokeStyle=css("--sell"); g.setLineDash([5,4]); g.beginPath(); g.moveTo(0,yy); g.lineTo(cw,yy); g.stroke(); g.setLineDash([]); g.fillStyle=css("--sell"); g.textAlign="left"; g.textBaseline="bottom"; g.font="700 11px "+css("--f-body"); g.fillText(opts.floorLabel||"",4,yy-2); }
  if(opts.split!=null){ const xx=x(opts.split); g.strokeStyle=ink; g.globalAlpha=.5; g.setLineDash([3,3]); g.beginPath(); g.moveTo(xx,padT); g.lineTo(xx,padT+ch); g.stroke(); g.setLineDash([]); g.globalAlpha=1; g.fillStyle=muted; g.font="700 11px "+css("--f-body"); g.textBaseline="top"; g.textAlign="right"; g.fillText("調整期間",xx-6,padT+2); g.textAlign="left"; g.fillText("確認期間",xx+6,padT+2); }
  for(const s of series){
    if(s.pts.length<2) continue;
    g.strokeStyle=s.color; g.lineWidth=2; g.beginPath();
    s.pts.forEach((p,k)=>{ k?g.lineTo(x(p.t),y(p.v)):g.moveTo(x(p.t),y(p.v)); }); g.stroke();
    g.save(); g.globalAlpha=.12; g.fillStyle=s.color; g.lineTo(x(s.pts[s.pts.length-1].t),padT+ch); g.lineTo(x(s.pts[0].t),padT+ch); g.closePath(); g.fill(); g.restore();
    const L=s.pts[s.pts.length-1]; g.fillStyle=s.color; g.beginPath(); g.arc(x(L.t),y(L.v),3.5,0,Math.PI*2); g.fill();
  }
}

function simState(sym, d){
  const c=S.cfg.cost[sym], px=midNow(sym), sim=S.sim||{}, p=curParams(S.cfg);
  const dir = sim.dir || (d.lean==="buy"?1:-1);
  const entry = sim.entry ?? +(px + dir*c.spread/2).toFixed(SYMS[sym].dec);
  const stop = d.sig.stopDist, rr = p.rr;
  const qty = sim.qty ?? (d.sz.qty>0 ? d.sz.qty : 1);
  const target = sim.target ?? NaN;   // 自由に入れる「この値まで」（入れなければ使わない）
  return { dir, entry, target, qty, stop, rr };
}
function simCalc(sym, st, target){
  const fx=fxNow(), c=S.cfg.cost[sym];
  const pnl=(target-st.entry)*st.dir*st.qty*fx, margin=st.entry*st.qty*fx/20;
  const swap=-(st.dir===1?c.swapLong:c.swapShort)*st.qty;
  return { pnl, margin, move:(target-st.entry)*st.dir, swap };
}
function simOut(sym, st){
  const sl = st.entry - st.dir*st.stop, tp = st.entry + st.dir*st.stop*st.rr;
  const a=simCalc(sym, st, sl), b=simCalc(sym, st, tp), x=isFinite(st.target)?simCalc(sym, st, st.target):null;
  return `<div class="k">損切りまで行ったら<br><span class="sub num">${fp(sym,sl)}（入る${st.dir===1?"−":"＋"}${st.stop.toFixed(1)}ドル）</span></div><div class="v big2 ${cls(a.pnl)}">${yen(a.pnl,true)}</div>

/* 短時間の急落・急騰の知らせ（売買の判断ではなく、参考の情報。research/spikes.mjs の結果） */
function spikeInfo(sym){
  const D=DATA[sym], B=base(sym), i=S.nowIdx, a=B.atr[Math.max(0,i-1)];
  let best=null;
  for(let j=i-2;j<=i;j++){ if(j<1) continue; const k=(D.c[j]-D.o[j])/B.atr[j-1]; if(Math.abs(k)>=3 && (!best||Math.abs(k)>Math.abs(best.k))) best={k, t:D.t[j]}; }
  const live=(midNow(sym)-D.c[i])/a;   // まだ確定していない今の足の動き
  if(Math.abs(live)>=3 && (!best||Math.abs(live)>Math.abs(best.k))) best={k:live, t:Date.now(), live:true};
  if(!best) return "";
  const down=best.k<0, TFh=new Intl.DateTimeFormat("ja-JP",{ timeZone:"Asia/Tokyo", hour:"numeric" });
  return `<div class="spike ${down?"down":"up"}"><b>${down?"急落":"急騰"}</b><span>${best.live?"今の1時間":TFh.format(new Date(best.t))+"台"}に、ふだんの${Math.abs(best.k).toFixed(1)}倍の動き。${down?"過去は、12時間後までに一部戻ることがやや多い（約6割）":"過去は、その後に続くか戻るかは半々"}。目安で、約束ではありません。</span></div>`;
}

/* 取引できる日の数（日本時間の日付で、月〜金。12/25と1/1は休みとして数える＝目安） */
function tradingDays(fromMs, toMs){
  let n=0;
  for(let t=fromMs; t<=toMs; t+=86400e3){
    const j=new Date(t+9*3600e3), wd=j.getUTCDay(), md=String(j.getUTCMonth()+1).padStart(2,"0")+"-"+String(j.getUTCDate()).padStart(2,"0");
    if(wd>=1 && wd<=5 && md!=="12-25" && md!=="01-01") n++;
  }
  return n;
}
function goalInfo(){
  const cfg=S.cfg, a=S.acct, ur=a.positions.reduce((s,p)=>s+unreal(p).pnl,0);
  const profit = a.balance - cfg.capital + ur, amount = cfg.goal.amount;
  const end = Date.parse(cfg.goal.deadline+"T23:59:59+09:00"), now = Date.now();
  const calDays = Math.max(0, Math.ceil((end-now)/86400e3));
  const days = end>now ? tradingDays(now, end) : 0;            // 残りの「取引できる日」
  const remain = Math.max(0, amount - profit), perDay = days ? remain/days : remain;
  // 直近3か月の検証での「取引できる日」1日あたり（目安）
  const pastDays = cfg.auto.from && cfg.auto.to ? Math.max(1, tradingDays(cfg.auto.from, cfg.auto.to)) : 65;
  const pace = cfg.auto.at && cfg.auto.trades ? cfg.auto.net/pastDays : null;
  const expect = pace!=null ? pace*days : null;
  return { profit, amount, days, calDays, remain, perDay, pace, expect, pct: amount>0 ? Math.max(0,Math.min(100, profit/amount*100)) : 0 };
}
/* 届く見込み（調整に使っていない期間の約330回の取引から：research/expect.mjs） */
const EXPECT = { meanR:0.155, sdR:1.6021, perDay:0.1876 };   // 2026/11/5 第9回の後（抜けた足0.6倍以上を加えた後）
function normCdf(z){ const t=1/(1+0.2316419*Math.abs(z)), d=0.3989423*Math.exp(-z*z/2), p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; }
function goalCard(){
  const g=goalInfo(), cfg=S.cfg;
  if(!(g.amount>0)) return `<section class="card"><h2>目標</h2><p class="note">「設定」で、期限と目標の利益を入れてください。</p></section>`;
  const n = EXPECT.perDay*g.days, mu = n*EXPECT.meanR*cfg.riskPerTrade, sd = Math.sqrt(Math.max(n,1e-9))*EXPECT.sdR*cfg.riskPerTrade;
  const pReach = g.remain<=0 ? 1 : 1-normCdf((g.remain-mu)/sd), pMinus = normCdf((-g.profit-mu)/sd);
  const pct = v => v<0.01 ? "1％未満" : v>0.99 ? "99％以上" : Math.round(v*100)+"％";
  const tile = (k,v,c="") => `<div class="tile"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;
  const hard = pReach < 0.05;
  return `<section class="card">
    <div class="sub">目標：${cfg.goal.deadline.replace(/-/g,"/")}までに ＋${yen(g.amount)}</div>
    <div class="big ${cls(g.profit)}">${yen(g.profit,true)}</div>
    <div class="goalbar"><span style="width:${g.pct}%"></span></div>
    ${hard?`<div class="warn-box"><b>この目標は現実的ではありません。</b>届く見込みは${pct(pReach)}です。目標に合わせて、かける額を増やさないでください。</div>`:""}
    <div class="tiles">
      ${tile("届く見込み", pct(pReach), hard?"":"up")}
      ${tile("期限までの見込み", (mu>=0?"＋":"−")+yen(Math.abs(mu)))}
      ${tile("マイナスになる割合", pct(pMinus))}
      ${tile("取引できる日", g.days+"日")}
    </div>
    <p class="note">見込みは、設定を選ぶのに使っていない期間の約280回の取引（2021〜2026年）から計算した目安で、約束ではありません。判断の方法はまだ検証中で、これからの練習の記録で確かめます。</p>
  </section>`;
}

function posBox(p, fallback){

  const dS=(p.sl-p.entry)*p.dir, sg=v=>(v>=0?"＋":"−")+Math.abs(v).toFixed(1);   // 損切りの位置（入った価格からの差。向きをそろえる）

function advance(n){
  const closed=[];
  for(let k=0;k<n && S.nowIdx<TOTAL-1;k++){
    S.nowIdx++;
    for(const pos of [...S.acct.positions]){
      const ex=checkExit(pos,DATA[pos.sym],S.nowIdx,S.cfg.cost[pos.sym]);
      if(ex) closed.push(closePos(S.acct,S.cfg,pos,ex.price,DATA[pos.sym].t[S.nowIdx],ex.why,fxAt(S.nowIdx)));
    }
  }
  save(); render();
  if(closed.length) toast(closed.map(t=>`${SYMS[t.sym].name} ${t.why} ${yen(t.net,true)}`).join(" ／ "));
  else if(S.nowIdx>=TOTAL-1) toast("サンプルデータの終わりに着きました");
}

function unb64u(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function pushState(){
  if(!WORKER || MODE!=="live") return;
  if(!S.notifyToken) return;
  const a=S.acct, t=Date.now(), dp=a.dayKey===dayKey(t)?a.dayPnl:0;
  try{ await fetch(WORKER+"/state",{ method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({ token:S.notifyToken, paramsI:S.cfg.paramsI, cost:S.cfg.cost.gold, riskPerTrade:S.cfg.riskPerTrade, capital:S.cfg.capital, dailyLimit:S.cfg.dailyLimit, fixed:S.cfg.fixed, stop:{ halted:!!a.halted, dayOver: dp <= -S.cfg.dailyLimit, full: a.positions.length>=S.cfg.maxPositions }, version:S.cfg.auto.at||0 }) }); }catch(e){}
}
async function enableNotify(){
  if(!WORKER){ toast("通知の準備がまだできていません"); return; }
  if(!canPush()){ toast("ホーム画面に追加したアプリから開くと、通知を受け取れます"); return; }
  let perm;
  try{ perm = await Notification.requestPermission(); }catch(e){ perm = "denied"; }
  if(perm!=="granted"){ toast("通知が許可されませんでした。iPhoneの「設定」→「通知」から許可できます"); render(); return; }
  try{
    const reg = await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
    const { publicKey } = await (await fetch(WORKER+"/vapid")).json();
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:unb64u(publicKey) });
    const r = await fetch(WORKER+"/subscribe",{ method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({ subscription:sub.toJSON() }) });
    if(!r.ok) throw new Error("subscribe");
    const jr = await r.json().catch(()=>({})); if(jr.token) S.notifyToken = jr.token;
    await pushState(); S.notifyOn = true; save(); render(); toast("通知を受け取る準備ができました");
  }catch(e){ toast("通知の登録に失敗しました。少し待ってからもう一度押してください"); }
}
async function testNotify(){
  if(!WORKER) return;
  try{ const r = await fetch(WORKER+"/test",{ method:"POST" }); toast(r.status===429 ? "少し待ってからもう一度押してください" : "テストの通知を送りました"); }catch(e){ toast("送れませんでした"); }
}
function clearBadge(){ try{ if(navigator.clearAppBadge) navigator.clearAppBadge(); }catch(e){} }

/* 本物のデータ：新しく確定した足と今の価格で、利確・損切りに届いたかを確かめる */
function processLive(){
  const closed=[];
  for(const pos of [...S.acct.positions]){
    const D=DATA[pos.sym], c=S.cfg.cost[pos.sym];
    let hit=null;
    for(let j=Math.max(0,D.t.length-600); j<D.t.length && !hit; j++){
      if(D.t[j] < pos.t || D.t[j] <= (pos.lastT||0)) continue;   // 記録した後に始まった足だけ
      const ex=checkExit(pos,D,j,c); pos.lastT=D.t[j];
      if(ex) hit={ ...ex, t:D.t[j], rate:DATA.fx[j] };
    }
    if(!hit){
      const bid = LIVE[pos.sym].price - pos.dir*c.spread/2;
      if(pos.dir===1 ? bid<=pos.sl : bid>=pos.sl) hit={ price:(pos.dir===1?Math.min(bid,pos.sl)-c.slip:Math.max(bid,pos.sl)+c.slip), why:"損切り", t:Date.now(), rate:fxNow() };
      else if(pos.dir===1 ? bid>=pos.tp : bid<=pos.tp) hit={ price:pos.tp, why:"利確", t:Date.now(), rate:fxNow() };
    }
    if(hit) closed.push(closePos(S.acct,S.cfg,pos,hit.price,hit.t,hit.why,hit.rate));
  }
  return closed;
}
/* 今の価格だけを約2分ごとに受け取る（1時間ごとの値動きは30分ごと） */
async function refreshPrice(){
  if(MODE!=="live" || !LIVE) return;
  try{
    const r = await fetch("api/price?symbol=XAU%2FUSD", { cache:"no-store" });
    const j = await r.json();
    if(!r.ok || !Number.isFinite(j.price)) return;
    LIVE.gold = { price:j.price, t:LIVE.gold.t }; PRICE_AT = j.t || Date.now();
  }catch(e){ return; }
  const closed = processLive();
  save();
  const typing = document.activeElement && document.activeElement.tagName==="INPUT";
  if(!typing || closed.length) render();   // 入力中は画面を書き換えない
  if(closed.length) toast(closed.map(t=>`${SYMS[t.sym].name} ${t.why} ${yen(t.net,true)}`).join(" ／ "));
}
async function refreshLive(manual){
  try{ await loadLive(); LOAD_ERR=null; PRICE_AT=Date.now(); }
  catch(e){ if(manual) toast(errText(e)); return; }
  if(manual) await refreshPrice();
  S.nowIdx = TOTAL-1;
  if(autoTune(false)){ toast("今月の設定を、直近3か月の値動きで見直しました"); pushState(); }
  const closed = processLive();
  save(); render();
  if(closed.length) toast(closed.map(t=>`${SYMS[t.sym].name} ${t.why} ${yen(t.net,true)}`).join(" ／ "));
  else if(manual) toast("最新の価格に更新しました");
}
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.sym){ S.sym=b.dataset.sym; S.sim=null; save(); render(); return; }
  if(b.dataset.simdir){ S.sim={ dir:+b.dataset.simdir, qty:(S.sim&&S.sim.qty) }; if(S.sim.qty==null) delete S.sim.qty; S.detailOpen=true; render(); return; }
  if(b.dataset.simset){
    const d=currentDecision(S.sym), st=simState(S.sym,d), w=b.dataset.simset, px=midNow(S.sym), h=S.cfg.cost[S.sym].spread/2;
    if(w==="reset") S.sim=null;
    S.detailOpen=true; render(); return;
  }
  if(b.dataset.tab){ S.tab=b.dataset.tab; S.ui={}; save(); render(); window.scrollTo(0,0); return; }
  const act=b.dataset.act; if(!act) return;
  if(act==="adv") advance(+b.dataset.n);
  else if(act==="refresh"){ b.disabled=true; b.textContent="更新中…"; refreshLive(true); }
  else if(act==="range"){ S.range=+b.dataset.n; save(); render(); }
  else if(act==="tf"){ S.tf=b.dataset.tf; save(); render(); }
  else if(act==="open"){
    const d=currentDecision(S.sym);
    if(d.verdict==="wait") return;
    openPos(S.acct,S.sym,d.lv,d.sz,tNow()); save(); render(); pushState();
    toast(`仮想取引を記録しました（${SYMS[S.sym].name} ${d.verdict==="buy"?"買い":"売り"} ${d.sz.qty}オンス）`);
  }
  else if(act==="close"){
    const pos=S.acct.positions.find(p=>p.id===+b.dataset.id); if(!pos) return;
    const u=unreal(pos), tr=closePos(S.acct,S.cfg,pos,u.px,tNow(),"手動で決済",fxNow());
    save(); render(); toast(`決済しました ${yen(tr.net,true)}`);
  }
  else if(act==="runbt"){
    b.disabled=true; b.textContent="計算中…（数秒かかります）";
    setTimeout(()=>{ S.bt=runValidation(S.cfg); render(); toast(`${S.bt.combos}通りの設定を試しました`); }, 30);
  }
  else if(act==="usebt" && S.bt && S.bt.rule===S.cfg.rule){ S.cfg[RULES[S.cfg.rule].pk]=clone(S.bt.robust.p); save(); render(); toast("判断のルールを検証で選んだ設定に変えました"); }
  else if(act==="notify-on"){ enableNotify(); }
  else if(act==="fixedtoggle"){ S.cfg.fixed.on=!S.cfg.fixed.on; save(); render(); pushState(); toast(S.cfg.fixed.on?"数量を固定にしました":"数量を自動にしました"); }
  else if(act==="demoask"){ S.ui.askDemo=!!b.dataset.v; render(); }
  else if(act==="demoreset"){ resetDemo(); }
  else if(act==="notify-test"){ testNotify(); }
  else if(act==="rule"){ S.cfg.rule=b.dataset.rule; S.bt=null; autoTune(true); save(); render(); toast(`判断のルールを「${RULES[S.cfg.rule].name}」にしました`); }
  else if(act==="autotune"){ S.cfg.auto.on=!S.cfg.auto.on; if(S.cfg.auto.on) autoTune(true); save(); render(); toast(S.cfg.auto.on?"毎月の自動見直しを始めました":"毎月の自動見直しを止めました"); }
  else if(act==="ask"){ S.ui.ask=b.dataset.what||null; render(); }
  else if(act==="reset"){ S.acct=newAcct(S.cfg); S.ui={}; save(); render(); toast("仮想取引を最初からやり直しました"); }
  else if(act==="resume"){ S.acct.halted=null; S.acct.peak=S.acct.balance; S.ui={}; save(); render(); toast("停止を解除しました"); }
});
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.dataset && el.dataset.date){ if(/^\d{4}-\d{2}-\d{2}$/.test(el.value)){ S.cfg.goal.deadline=el.value; save(); toast("保存しました"); setTimeout(render,0); } return; }
  if(!el.dataset || !el.dataset.path) return;
  const v=parseFloat(el.value), canMinus=/swap/.test(el.dataset.path);
  if(!isFinite(v) || (v<0 && !canMinus)){ toast(canMinus?"数字を入れてください":"0以上の数字を入れてください"); render(); return; }
  const path=el.dataset.path.split("."); let o=S.cfg; for(let k=0;k<path.length-1;k++) o=o[path[k]];
  if(path[0]==="params" && (path[1]==="fast"||path[1]==="slow")){ if(v<2||v>200){ toast("平均線は2〜200時間で入れてください"); render(); return; } }
  o[path[path.length-1]] = path[path.length-1]==="maxPositions" ? Math.max(1,Math.round(v)) : v;
  if(["capital","riskPerTrade","dailyLimit"].includes(path[0])) applyAuto(S.cfg);
  if(S.cfg.params.fast>=S.cfg.params.slow) toast("短期の平均線は長期より短くしてください");
  if(S.cfg.cost.gold.step<=0) S.cfg.cost.gold.step=0.1;
  if(S.cfg.cost.silver.step<=0) S.cfg.cost.silver.step=1;
  save(); toast("保存しました");
  if(["capital","riskPerTrade","dailyLimit","goal","fixed"].includes(path[0])) setTimeout(render, 0);
  if(["capital","riskPerTrade","dailyLimit","fixed"].includes(path[0])) pushState();   // 入力欄を離れた直後に書き換えると失敗するので、少し後で
});
document.addEventListener("input", e=>{
  const g=e.target;
  if(g.dataset && g.dataset.gmo){ const v=parseFloat(g.value); S.gmo={ v:isFinite(v)?v:"", barT:DATA[S.sym].t[S.nowIdx] }; const o=$("#gmo-out"); if(o) o.innerHTML=gmoOut(+g.dataset.gmo, v, +g.dataset.sl, +g.dataset.tp); return; }
  const el=e.target; if(!el.dataset || !el.dataset.sim) return;
  const v=parseFloat(el.value); if(!isFinite(v)) return;
  const d=currentDecision(S.sym), st=simState(S.sym,d);
  S.sim={ ...st, [el.dataset.sim]:v }; S.detailOpen=true;
  const out=$("#sim-out"); if(out) out.innerHTML=simOut(S.sym, S.sim);
});
document.addEventListener("toggle", e=>{ if(e.target && e.target.id==="detail-box") S.detailOpen=e.target.open; }, true);

try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawAll); }catch(e){}
new MutationObserver(drawAll).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
if(document.fonts && document.fonts.ready) document.fonts.ready.then(drawAll);
async function boot(){
  if(CAN_LIVE){
    $("#app").innerHTML = `<div class="card">価格データを読み込んでいます…</div>`;
    try{ await loadLive(); MODE="live"; }
    catch(e){ LOAD_ERR=e; MODE="sample"; DATA=genData(); TOTAL=HIST+FUT; for(const k in CACHE) delete CACHE[k]; }
  }
  initState();
  clearBadge(); document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) clearBadge(); });
  if(MODE==="live"){ PRICE_AT=FETCHED_AT; autoTune(false); processLive(); save(); pushState();
    setInterval(()=>{ if(!document.hidden) refreshLive(false); }, 30*60e3);
    setInterval(()=>{ if(!document.hidden) refreshPrice(); }, 120e3);
    refreshPrice();
    document.addEventListener("visibilitychange", ()=>{ if(document.hidden) return; if(Date.now()-FETCHED_AT > 30*60e3) refreshLive(false); else if(Date.now()-PRICE_AT > 120e3) refreshPrice(); }); }
  render();
}
boot();
</script>
